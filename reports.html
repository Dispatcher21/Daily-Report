<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>View Reports</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1c3d5a">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Daily Reports">
<link rel="stylesheet" href="style.css">
<script src="theme.js"></script>
<style>
  /* Off-screen sandbox for generating report-row thumbnails -- laid out
     normally (not display:none) so html2canvas measures real layout, just
     never visible. Same technique as download.html's #render-sandbox. */
  #render-sandbox { position: fixed; top: 0; left: -20000px; z-index: -1; }
</style>
</head>
<body>

<header class="app-header">
  <div>
    <h1>View Reports</h1>
    <div class="app-sub" id="project-name-sub"></div>
  </div>
  <span></span>
</header>
<div class="back-bar">
  <a href="#" id="bb-back-link">&larr; Project</a>
  <span class="bb-sep">//</span>
  <span class="bb-cur">Reports</span>
</div>

<main>
  <div class="filter-row">
    <div class="filter-box">
      <label>From</label>
      <input type="date" id="f-date-from">
    </div>
    <div class="filter-box">
      <label>To</label>
      <input type="date" id="f-date-to">
    </div>
    <div class="filter-box" style="flex:2;min-width:160px;">
      <label>Search Activity/Notes</label>
      <input type="text" id="f-search" placeholder="Type to filter...">
    </div>
    <div class="filter-box" style="min-width:150px;">
      <label>Sort By</label>
      <select id="f-sort">
        <option value="date-desc">Date (Newest)</option>
        <option value="date-asc">Date (Oldest)</option>
        <option value="no-desc">Report # (High-Low)</option>
        <option value="no-asc">Report # (Low-High)</option>
      </select>
    </div>
    <div style="display:flex;align-items:flex-end;">
      <button type="button" class="btn-sm" id="btn-clear-filters">&times; Clear</button>
    </div>
  </div>

  <div class="select-all-row">
    <button type="button" class="text-btn" id="btn-select-all">Select all</button>
    <span id="select-count-label"></span>
    <button type="button" class="view-toggle-btn" id="btn-refresh" title="Refresh reports and thumbnails" aria-label="Refresh reports and thumbnails">&#8635;</button>
    <div class="view-toggle" id="view-toggle" role="group" aria-label="View as">
      <button type="button" class="view-toggle-btn" data-view="list" title="List view" aria-label="List view">&#9776;</button>
      <button type="button" class="view-toggle-btn" data-view="grid" title="Thumbnail view" aria-label="Thumbnail view">&#9638;</button>
    </div>
  </div>

  <div id="report-list" class="report-list"></div>

  <div id="bulk-bar" class="step" hidden style="position:sticky;bottom:0.5rem;">
    <div class="step-body">
      <div class="export-bar" style="margin-top:0;">
        <button type="button" class="btn-primary" id="btn-print-selected">Generate Selected</button>
        <button type="button" class="btn-secondary" id="btn-qty-sheet-selected">Build Quantity Sheet</button>
        <button type="button" class="btn-secondary" id="btn-mass-edit-selected">Mass Edit Selected</button>
        <button type="button" class="btn-danger" id="btn-delete-selected">Delete Selected</button>
      </div>
    </div>
  </div>

  <div id="mass-edit-panel" class="step" hidden>
    <div class="step-header">
      <span class="step-num">MASS EDIT</span>
      <h2>Apply One Field to Selected Reports</h2>
    </div>
    <div class="step-body">
      <p class="warn">This overwrites the chosen field on every selected report. Cannot be undone (though each report can still be edited individually afterward).</p>
      <div class="field-grid">
        <label>Field
          <select id="me-field"></select>
        </label>
        <label id="me-value-wrap">New Value <input type="text" id="me-value" placeholder="Value to apply"></label>
      </div>
      <label id="me-textarea-wrap" hidden>New Value <textarea id="me-value-textarea" rows="4" placeholder="Value to apply"></textarea></label>
      <div id="me-select-wrap" hidden>
        <label>New Value
          <select id="me-value-select">
            <option value="IN_PLACE">In Place</option>
            <option value="ATTENTION_REQUIRED">Attention Required</option>
          </select>
        </label>
      </div>
      <div class="export-bar">
        <button type="button" class="btn-primary" id="btn-apply-mass-edit">Apply to Selected</button>
        <button type="button" class="btn-secondary" id="btn-cancel-mass-edit">Cancel</button>
      </div>
    </div>
  </div>

  <a class="fab" id="fab-new-report" href="#">+ New Report</a>
</main>

<div id="render-sandbox"></div>

<script src="common.js"></script>
<script src="defaults.js"></script>
<script src="storage.js"></script>
<script src="audit-log.js"></script>
<script type="module" src="firebase-init.js"></script>
<script src="firebase-sync.js"></script>
<script>
const projectId = queryParam('project');
let project = null;
let allReports = [];
let selectedIds = new Set();
// Fetched once per page load (room/permissions/name each cost a settings
// read) rather than per report -- see canEditReportWithContext.
let reportPermCtx = { isAdmin: true, canEditAny: true, canEditOwn: true, userName: null };

// ---------- Report row thumbnails ----------
//
// Small rendered images of each report's two printed pages (front: the work
// report, back: the photo log), generated lazily (not blocking the list) and
// cached on the report itself (thumbnail/thumbnailBack/thumbnailAt,
// local-only -- see defaults.js/firebase-sync.js) so it's instant on every
// visit after the first. render-report.js/print-sheet.css/html2canvas are
// loaded on demand rather than as static <script> tags, so a page with
// nothing left to generate never pays for them at all.
let thumbnailUrls = new Map(); // report id -> { front, back } object URLs, kept for the life of the page
let thumbnailInFlight = new Set();
let thumbnailLibsPromise = null;
const THUMB_CAPTURE_WIDTH = 150; // device px, before scaling for a retina screen -- shared by both the smaller list-row thumbs and the bigger grid-view ones, sized for the larger of the two so neither looks soft

function loadScriptOnce(src) {
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = src;
    s.onload = resolve;
    s.onerror = () => reject(new Error('Failed to load ' + src));
    document.head.appendChild(s);
  });
}
function loadStylesheetOnce(href) {
  return new Promise((resolve, reject) => {
    const l = document.createElement('link');
    l.rel = 'stylesheet';
    l.href = href;
    l.onload = resolve;
    l.onerror = () => reject(new Error('Failed to load ' + href));
    document.head.appendChild(l);
  });
}
// A single shared promise so two overlapping ensureThumbnails() calls (e.g.
// the admin changes a filter while thumbnails are still generating) can't
// both inject render-report.js -- a second copy would throw redeclaring its
// top-level consts.
function ensureThumbnailLibs() {
  if (!thumbnailLibsPromise) {
    thumbnailLibsPromise = Promise.all([
      loadStylesheetOnce('print-sheet.css'),
      loadScriptOnce('lib/html2canvas.min.js'),
      loadScriptOnce('render-report.js'),
    ]);
  }
  return thumbnailLibsPromise;
}

function showThumb(id, frontBlob, backBlob) {
  const frontUrl = URL.createObjectURL(frontBlob);
  const backUrl = URL.createObjectURL(backBlob);
  thumbnailUrls.set(id, { front: frontUrl, back: backUrl });
  $$(`[data-thumb="${id}"]`).forEach((wrap) => {
    wrap.querySelector('[data-page="1"]').innerHTML = `<img src="${frontUrl}" alt="Page 1">`;
    wrap.querySelector('[data-page="2"]').innerHTML = `<img src="${backUrl}" alt="Page 2">`;
  });
}

// Renders both of a report's printed pages (the work report and the photo
// log) into `sandbox` at thumbnail size and rasterizes each -- the same
// renderReportPages used for the real PDF, just captured far smaller since
// nothing here needs print resolution.
async function generateReportThumbnailBlobs(sandbox, layout, report, logoBlob) {
  const pages = renderReportPages(sandbox, layout, report, logoBlob);
  await waitForImages(sandbox);
  await new Promise((resolve) => setTimeout(resolve, 30));

  const capture = async (page) => {
    const scale = (THUMB_CAPTURE_WIDTH * (window.devicePixelRatio > 1 ? 2 : 1)) / page.offsetWidth;
    const canvas = await html2canvas(page, {
      scale,
      backgroundColor: '#ffffff',
      useCORS: true,
      width: page.offsetWidth,
      height: page.offsetHeight,
    });
    return new Promise((resolve) => canvas.toBlob(resolve, 'image/jpeg', 0.72));
  };

  const front = await capture(pages[0].el);
  const back = await capture(pages[1].el);

  pages.forEach(({ el }) => {
    $$('img', el).forEach((img) => {
      if (img.src.startsWith('blob:')) URL.revokeObjectURL(img.src);
    });
    el.remove();
  });

  return { front, back };
}

// Wires up whatever's already cached immediately (cheap: just object URLs),
// then generates the rest one at a time in the background, yielding a frame
// between each so scrolling/typing on the list stays responsive.
async function ensureThumbnails(list) {
  list.forEach((r) => {
    if (r.thumbnail && r.thumbnailBack && r.thumbnailAt === r.updatedAt && !thumbnailUrls.has(r.id)) {
      showThumb(r.id, r.thumbnail, r.thumbnailBack);
    }
  });

  const stale = list.filter((r) =>
    (!r.thumbnail || !r.thumbnailBack || r.thumbnailAt !== r.updatedAt) && !thumbnailInFlight.has(r.id)
  );
  if (stale.length === 0) return;

  try {
    await ensureThumbnailLibs();
  } catch (err) {
    console.error('Could not load thumbnail renderer:', err);
    return;
  }
  const sandbox = $('#render-sandbox');
  const [layout, logoBlob] = await Promise.all([loadPrintLayout(), getReportLogo()]);

  for (const r0 of stale) {
    thumbnailInFlight.add(r0.id);
    try {
      // The photo log page needs the actual photo bytes, not just knowing a
      // slot is filled -- a report synced from the company but never opened
      // on this device still has photosFetched[i] === false and blank
      // photos[i] until something asks for them. Worth pulling here (a
      // one-time cost, same lazy-fetch report-editor.html/download.html
      // already do on open) rather than generating a photo log thumbnail
      // that's permanently missing every image.
      const r = await fetchReportMedia(r0);
      const { front, back } = await generateReportThumbnailBlobs(sandbox, layout, r, logoBlob);
      r.thumbnail = front;
      r.thumbnailBack = back;
      r.thumbnailAt = r.updatedAt;
      // putReportRaw, not saveReport -- generating a thumbnail to look at
      // the list isn't an edit, so it shouldn't bump updatedAt/lastEditedBy
      // (which would just invalidate the thumbnail it's trying to cache).
      await putReportRaw(r);
      // fetchReportMedia returns a new object rather than mutating r0 --
      // swap it into allReports too, so the now-fetched photos don't need
      // pulling again next time (a re-render, a mass edit, opening the
      // report) just because the in-memory list still pointed at the old,
      // photo-less one.
      const idx = allReports.indexOf(r0);
      if (idx !== -1) allReports[idx] = r;
      showThumb(r.id, front, back);
    } catch (err) {
      console.error('Thumbnail generation failed for report', r0.id, err);
    } finally {
      thumbnailInFlight.delete(r0.id);
    }
    // setTimeout, not requestAnimationFrame -- rAF is throttled/suspended
    // on a backgrounded tab and would hang the whole loop (see the same
    // caution in pdf-export.js). setTimeout still fires either way, and
    // still yields long enough for scrolling/typing to stay responsive.
    await new Promise((resolve) => setTimeout(resolve, 0));
  }
}

// ---------- View mode (list / grid, like a Windows folder) ----------
//
// Remembered per device (not per project) via saveSetting, same as theme --
// whichever way someone likes to browse reports is probably how they want
// to browse every project's reports.
const VIEW_MODE_SETTING = 'reportsViewMode';
let viewMode = 'list';

function setViewMode(mode) {
  viewMode = mode;
  $$('#view-toggle .view-toggle-btn').forEach((btn) => btn.classList.toggle('active', btn.dataset.view === mode));
  saveSetting(VIEW_MODE_SETTING, mode).catch((err) => console.error(err));
  render();
}

// Scoped to #view-toggle specifically -- #btn-refresh reuses .view-toggle-btn
// purely for its square-icon-button look, and isn't part of the list/grid
// toggle group, so a bare .view-toggle-btn selector here would wire it up
// to call setViewMode(undefined) on click and quietly corrupt the view mode.
$$('#view-toggle .view-toggle-btn').forEach((btn) => {
  btn.addEventListener('click', () => setViewMode(btn.dataset.view));
});

async function init() {
  project = projectId ? await getProject(projectId) : null;
  if (!project || !projectInScope(project.id, await getCompanyRoom())) {
    location.href = 'index.html';
    return;
  }
  document.title = `View Reports — ${project.name}`;
  $('#project-name-sub').textContent = project.name;
  $('#bb-back-link').href = `project.html?id=${project.id}`;
  $('#fab-new-report').href = `report-editor.html?project=${project.id}&report=new`;

  // Company members may be restricted from editing/deleting reports once
  // saved (and "own reports only" restricts *which* ones -- see render(),
  // which only gives a row a checkbox if this context allows it) -- gated
  // here, not by hiding "+ New Report" (creating one is always allowed).
  reportPermCtx = await getReportPermissionContext();
  if (!reportPermCtx.isAdmin && !reportPermCtx.canEditAny && !reportPermCtx.canEditOwn) {
    $('#btn-delete-selected').hidden = true;
    $('#btn-mass-edit-selected').hidden = true;
  }

  const savedViewMode = await getSetting(VIEW_MODE_SETTING);
  viewMode = savedViewMode === 'grid' ? 'grid' : 'list';
  $$('#view-toggle .view-toggle-btn').forEach((btn) => btn.classList.toggle('active', btn.dataset.view === viewMode));

  allReports = await getReportsForProject(project.id);
  render();
}

// Manual "Refresh" -- pulls the latest company data (bypassing the usual
// throttle, since someone explicitly asked) and force-regenerates every
// visible thumbnail, not just the ones ensureThumbnails would otherwise
// consider stale. Uses the shared progress banner so a slow pull on a bad
// connection is visibly working rather than looking hung.
$('#btn-refresh').addEventListener('click', async () => {
  const btn = $('#btn-refresh');
  btn.disabled = true;
  btn.classList.add('spinning');
  startProgressBanner();
  try {
    if (await getCompanyRoom()) {
      progressStep('pulling', 'Getting the latest reports');
      await autoPullCompanyData(true);
      allReports = await getReportsForProject(project.id);
    }
    progressStep('thumbnails', 'Rebuilding thumbnails');
    thumbnailUrls.forEach(({ front, back }) => {
      URL.revokeObjectURL(front);
      URL.revokeObjectURL(back);
    });
    thumbnailUrls.clear();
    // In-memory only, not persisted -- ensureThumbnails treats a mismatched
    // thumbnailAt as stale and regenerates, then writes the real value back
    // via putReportRaw once it does.
    allReports.forEach((r) => { r.thumbnailAt = null; });
    render();
    finishProgressBanner('Refreshed!');
  } catch (err) {
    console.error(err);
    progressBannerError(userError("Couldn't refresh: " + err.message, 'REFRESH_REPORTS'));
  } finally {
    btn.disabled = false;
    btn.classList.remove('spinning');
  }
});

function getFilteredSorted() {
  const from = $('#f-date-from').value;
  const to = $('#f-date-to').value;
  const search = $('#f-search').value.trim().toLowerCase();
  const sort = $('#f-sort').value;

  let list = allReports.filter((r) => {
    if (from && r.date < from) return false;
    if (to && r.date > to) return false;
    if (search) {
      const hay = `${r.activity || ''} ${r.notes || ''}`.toLowerCase();
      if (!hay.includes(search)) return false;
    }
    return true;
  });

  list.sort((a, b) => {
    if (sort === 'date-asc') return (a.date || '').localeCompare(b.date || '');
    if (sort === 'date-desc') return (b.date || '').localeCompare(a.date || '');
    if (sort === 'no-asc') return (Number(a.reportNo) || 0) - (Number(b.reportNo) || 0);
    if (sort === 'no-desc') return (Number(b.reportNo) || 0) - (Number(a.reportNo) || 0);
    return 0;
  });

  return list;
}

// Both pages' thumbnails, shared markup between list rows and grid cards --
// see showThumb, which fills these in by id once generated.
function reportThumbsHtml(r) {
  const t = thumbnailUrls.get(r.id);
  const page = (n, src) =>
    `<div class="thumb-page" data-page="${n}">${src ? `<img src="${src}" alt="Page ${n}">` : '<span class="thumb-placeholder">&#128196;</span>'}</div>`;
  return `<div class="report-thumbs" data-thumb="${r.id}">${page(1, t && t.front)}${page(2, t && t.back)}</div>`;
}

function reportBadgesHtml(r) {
  const badges = [];
  if (isNoWorkDayReport(r)) badges.push('<span class="report-row-nwd">NO WORK DAY</span>');
  if (isWeatherDayReport(r)) badges.push('<span class="report-row-wd">WEATHER DAY</span>');
  if (r.createdBy || r.representative) badges.push(`<span class="report-row-author">${escapeHtml(r.createdBy || r.representative)}</span>`);
  return badges.join(' ');
}

function reportCheckboxHtml(r) {
  return canEditReportWithContext(r, reportPermCtx)
    ? `<input type="checkbox" class="report-row-check" ${selectedIds.has(r.id) ? 'checked' : ''}>`
    : `<span class="report-row-check-spacer"></span>`;
}

// ---------- Data-quality warnings ----------
//
// Flags things worth a human double-checking -- never blocking, just a
// heads-up. Computed across every report for the project (not just the
// currently filtered/visible list), so e.g. a duplicate date hiding behind
// an active filter still gets caught. Returns id -> string[] of reasons.
function computeReportWarnings(reports) {
  const warnings = new Map();
  const flag = (id, msg) => {
    if (!warnings.has(id)) warnings.set(id, []);
    warnings.get(id).push(msg);
  };

  const byDate = new Map();
  reports.forEach((r) => {
    if (!r.date) return;
    if (!byDate.has(r.date)) byDate.set(r.date, []);
    byDate.get(r.date).push(r);
  });
  byDate.forEach((list) => {
    if (list.length < 2) return;
    list.forEach((r) => {
      const others = list.filter((x) => x !== r).map((x) => `#${x.reportNo}`).join(', ');
      flag(r.id, `Same date as ${others}`);
    });
  });

  // Report No. is a free-typed field (not an auto-assigned ID), so two
  // different reports can end up sharing one -- this is a separate check
  // from the date one above since either can happen without the other (two
  // reports dated the same day with different numbers, or two differently-
  // dated reports someone typed the same number into).
  const byReportNo = new Map();
  reports.forEach((r) => {
    const no = String(r.reportNo ?? '').trim();
    if (!no) return;
    if (!byReportNo.has(no)) byReportNo.set(no, []);
    byReportNo.get(no).push(r);
  });
  byReportNo.forEach((list) => {
    if (list.length < 2) return;
    list.forEach((r) => {
      const others = list.filter((x) => x !== r).map((x) => x.date || 'no date').join(', ');
      flag(r.id, `Same Report No. as ${others}`);
    });
  });

  // Hours well off the average of days actually worked -- excludes No Work
  // Days (0 is correct there, not an anomaly) and reports with no hours
  // entered at all. Needs a handful of real data points before "average"
  // means anything, so this stays quiet on a brand-new project.
  const worked = reports.filter(
    (r) => !isNoWorkDayReport(r) && !isWeatherDayReport(r) && r.hours !== '' && r.hours != null && Number.isFinite(Number(r.hours))
  );
  if (worked.length >= 3) {
    const avg = worked.reduce((sum, r) => sum + Number(r.hours), 0) / worked.length;
    worked.forEach((r) => {
      const h = Number(r.hours);
      if (h > avg * 1.5) flag(r.id, `${h} hours is well above the project average (${avg.toFixed(1)})`);
      else if (h < avg * 0.5) flag(r.id, `${h} hours is well below the project average (${avg.toFixed(1)})`);
    });
  }

  reports.forEach((r) => {
    if (Number(r.hours) > 0 && !(r.workSummary || '').trim()) {
      flag(r.id, 'Hours logged but Work Summary is blank');
    }
  });

  return warnings;
}

let reportWarnings = new Map();

function reportWarningHtml(r) {
  const reasons = reportWarnings.get(r.id);
  if (!reasons || reasons.length === 0) return '';
  return `<button type="button" class="report-warn-btn" data-warn="${r.id}" title="${escapeHtml(reasons.join(' • '))}" aria-label="Warning: ${escapeHtml(reasons.join(' • '))}">⚠️</button>`;
}

function renderRow(r) {
  const badges = reportBadgesHtml(r);
  return `
    <div class="report-row" data-id="${r.id}">
      ${reportCheckboxHtml(r)}
      ${reportThumbsHtml(r)}
      <div class="report-row-main" data-open="${r.id}">
        <span class="report-row-date">${r.date || '(no date)'}${badges ? ' ' + badges : ''}</span>
        <span class="report-row-sub">${escapeHtml(r.activity || 'No activity noted')}</span>
      </div>
      <div class="report-row-actions">
        ${reportWarningHtml(r)}
        <a class="btn-sm" href="report-editor.html?project=${project.id}&report=${r.id}">Edit</a>
        <span class="report-row-no">#${r.reportNo}</span>
      </div>
    </div>`;
}

function renderCard(r) {
  // Activity leads the card -- it's the thing actually worth scanning for.
  // A true No Work Day/Weather Day report has nothing there by design (the
  // buttons that make one only touch Notes, never Activity), so its badge
  // takes over that slot instead of every one just saying "No activity noted".
  const activityHtml = !r.activity && isNoWorkDayReport(r)
    ? '<span class="report-row-nwd">NO WORK DAY</span>'
    : !r.activity && isWeatherDayReport(r)
    ? '<span class="report-row-wd">WEATHER DAY</span>'
    : escapeHtml(r.activity || 'No activity noted');
  const authorBadge = (r.createdBy || r.representative)
    ? ` <span class="report-row-author">${escapeHtml(r.createdBy || r.representative)}</span>`
    : '';
  return `
    <div class="report-card" data-id="${r.id}">
      <div class="report-card-top">
        ${reportCheckboxHtml(r)}
        ${reportWarningHtml(r)}
        <span class="report-row-no">#${r.reportNo}</span>
      </div>
      <div class="report-card-body" data-open="${r.id}">
        <span class="report-card-activity">${activityHtml}</span>
        ${reportThumbsHtml(r)}
        <span class="report-row-date">${r.date || '(no date)'}${authorBadge}</span>
      </div>
      <a class="btn-sm report-card-edit" href="report-editor.html?project=${project.id}&report=${r.id}">Edit</a>
    </div>`;
}

function render() {
  const list = getFilteredSorted();
  const container = $('#report-list');
  container.className = viewMode === 'grid' ? 'report-grid' : 'report-list';
  reportWarnings = computeReportWarnings(allReports);

  if (allReports.length === 0) {
    container.innerHTML = '<div class="empty-state">No reports yet. Tap "+ New Report" to start today\'s.</div>';
  } else if (list.length === 0) {
    container.innerHTML = '<div class="empty-state">No reports match the current filters.</div>';
  } else {
    container.innerHTML = list.map(viewMode === 'grid' ? renderCard : renderRow).join('');
  }

  $$('.report-warn-btn', container).forEach((btn) => {
    btn.addEventListener('click', (e) => {
      e.preventDefault();
      e.stopPropagation();
      const reasons = reportWarnings.get(btn.dataset.warn) || [];
      alert('Worth a look:\n\n' + reasons.map((r) => '• ' + r).join('\n'));
    });
  });
  $$('.report-row-check', container).forEach((cb) => {
    cb.addEventListener('change', (e) => {
      const id = e.target.closest('.report-row, .report-card').dataset.id;
      if (e.target.checked) selectedIds.add(id);
      else selectedIds.delete(id);
      updateBulkBar();
    });
  });
  $$('[data-open]', container).forEach((el) => {
    el.addEventListener('click', () => {
      location.href = `report-editor.html?project=${project.id}&report=${el.dataset.open}`;
    });
  });

  const editableCount = list.filter((r) => canEditReportWithContext(r, reportPermCtx)).length;
  $('#btn-select-all').textContent = selectedIds.size === editableCount && editableCount > 0 ? 'Deselect all' : 'Select all';
  updateBulkBar();

  if (list.length > 0) ensureThumbnails(list).catch((err) => console.error(err));
}

// The "+ New Report" FAB sits fixed at the same bottom-of-screen spot the
// bulk action bar occupies once something's selected -- rather than the two
// fighting for the same space (Delete Selected kept ending up underneath
// the FAB), the FAB just steps aside while a selection is active. Nothing's
// lost: every action relevant during selection lives in the bulk bar.
function updateBulkBar() {
  const n = selectedIds.size;
  $('#select-count-label').textContent = n > 0 ? `${n} selected` : '';
  $('#bulk-bar').hidden = n === 0;
  $('#fab-new-report').hidden = n > 0;
  $('#btn-print-selected').textContent = n === 1 ? 'Generate Selected' : `Generate Selected (${n})`;
  $('#btn-delete-selected').textContent = n === 1 ? 'Delete Selected' : `Delete Selected (${n})`;
  $('#btn-qty-sheet-selected').textContent = n === 1 ? 'Build Quantity Sheet' : `Build Quantity Sheet (${n})`;
}

['f-date-from', 'f-date-to', 'f-search', 'f-sort'].forEach((id) => {
  $('#' + id).addEventListener('input', render);
});

$('#btn-clear-filters').addEventListener('click', () => {
  $('#f-date-from').value = '';
  $('#f-date-to').value = '';
  $('#f-search').value = '';
  $('#f-sort').value = 'date-desc';
  render();
});

$('#btn-select-all').addEventListener('click', () => {
  const list = getFilteredSorted().filter((r) => canEditReportWithContext(r, reportPermCtx));
  if (selectedIds.size === list.length && list.length > 0) {
    selectedIds.clear();
  } else {
    list.forEach((r) => selectedIds.add(r.id));
  }
  render();
});

$('#btn-print-selected').addEventListener('click', () => {
  if (selectedIds.size === 0) return;
  const ids = Array.from(selectedIds).join(',');
  location.href = `download.html?project=${project.id}&report=${ids}`;
});

$('#btn-qty-sheet-selected').addEventListener('click', () => {
  if (selectedIds.size === 0) return;
  const ids = Array.from(selectedIds).join(',');
  location.href = `quantity-sheet.html?project=${project.id}&report=${ids}`;
});

$('#btn-delete-selected').addEventListener('click', async () => {
  if (selectedIds.size === 0) return;
  // Never trust selection state alone for a destructive bulk action --
  // re-check permission per report here too, not just when the checkbox
  // was drawn.
  const selected = allReports.filter((r) => selectedIds.has(r.id) && canEditReportWithContext(r, reportPermCtx));
  if (selected.length === 0) return;

  // Name what's going, so a mis-tap on the wrong row is obvious before it's
  // too late -- there's no undo and these are a day's work each.
  const list = selected
    .slice(0, 5)
    .map((r) => `  #${r.reportNo}  ${r.date || '(no date)'}`)
    .join('\n');
  const more = selected.length > 5 ? `\n  ...and ${selected.length - 5} more` : '';
  const msg =
    selected.length === 1
      ? `Delete this report?\n\n${list}\n\nThis cannot be undone.`
      : `Delete ${selected.length} reports?\n\n${list}${more}\n\nThis cannot be undone.`;
  if (!confirm(msg)) return;

  const btn = $('#btn-delete-selected');
  const original = btn.textContent;
  btn.textContent = 'Deleting...';
  btn.disabled = true;
  try {
    for (const r of selected) {
      await deleteReport(r.id);
    }
    selectedIds.clear();
    allReports = await getReportsForProject(project.id);
    render();
  } catch (err) {
    console.error(err);
    alert(userError("Couldn't delete: " + err.message, 'DELETE_REPORTS'));
  } finally {
    btn.textContent = original;
    btn.disabled = false;
  }
});

// ---------- Mass edit ----------
//
// Every report field where one shared value across a batch of reports
// actually makes sense -- the descriptive/status fields a whole week of
// reports often *should* share. Deliberately excludes anything that's
// inherently unique per report (date, report #, hours, pay items, photos,
// signatures) or that mirrors the project file rather than being edited
// per-report (projectNo/projectName/ntpDate).
const MASS_EDIT_FIELDS = [
  { key: 'activity', label: 'Activity', type: 'text' },
  { key: 'representative', label: 'Representative', type: 'text' },
  { key: 'peName', label: 'PE Name', type: 'text' },
  { key: 'notes', label: 'Notes', type: 'textarea' },
  { key: 'workSummaryHeader', label: 'Work Summary Top Line', type: 'text' },
  { key: 'trafficControlNote', label: 'Short Work Summary', type: 'text' },
  { key: 'workSummary', label: 'Work Summary', type: 'textarea' },
  { key: 'controllingItem', label: 'Controlling Item', type: 'text' },
  { key: 'commentsOnTime', label: 'Comments on Time Charged', type: 'textarea' },
  { key: 'controllingItemTimeFrom', label: 'Controlling Item Time From', type: 'text' },
  { key: 'controllingItemTimeTo', label: 'Controlling Item Time To', type: 'text' },
  { key: 'workingConditions', label: 'Working Conditions', type: 'textarea' },
  { key: 'trafficControlSelect', label: 'Traffic Control Status', type: 'select' },
  { key: 'workBegin', label: 'Work Begin', type: 'text' },
  { key: 'workEnd', label: 'Work End', type: 'text' },
  { key: 'weatherDesc', label: 'Weather Description', type: 'text' },
  { key: 'tempHigh', label: 'Temp High', type: 'text' },
  { key: 'tempLow', label: 'Temp Low', type: 'text' },
];

$('#me-field').innerHTML = MASS_EDIT_FIELDS.map((f) => `<option value="${f.key}">${escapeHtml(f.label)}</option>`).join('');

$('#btn-mass-edit-selected').addEventListener('click', () => {
  $('#mass-edit-panel').hidden = false;
  $('#mass-edit-panel').scrollIntoView({ behavior: 'smooth' });
});
$('#btn-cancel-mass-edit').addEventListener('click', () => {
  $('#mass-edit-panel').hidden = true;
});

function meFieldType() {
  const field = MASS_EDIT_FIELDS.find((f) => f.key === $('#me-field').value);
  return field ? field.type : 'text';
}

$('#me-field').addEventListener('change', () => {
  const type = meFieldType();
  $('#me-value-wrap').hidden = type !== 'text';
  $('#me-textarea-wrap').hidden = type !== 'textarea';
  $('#me-select-wrap').hidden = type !== 'select';
});
$('#me-field').dispatchEvent(new Event('change'));

$('#btn-apply-mass-edit').addEventListener('click', async () => {
  const field = $('#me-field').value;
  const type = meFieldType();
  const value = type === 'select' ? $('#me-value-select').value : type === 'textarea' ? $('#me-value-textarea').value : $('#me-value').value;
  if (selectedIds.size === 0) return;
  if (!confirm(`Apply this value to ${selectedIds.size} selected report(s)? This cannot be undone.`)) return;

  const btn = $('#btn-apply-mass-edit');
  btn.disabled = true;
  try {
    const selected = allReports.filter((r) => selectedIds.has(r.id) && canEditReportWithContext(r, reportPermCtx));
    for (const r of selected) {
      r[field] = value;
      await saveReport(r);
    }
    $('#mass-edit-panel').hidden = true;
    allReports = await getReportsForProject(project.id);
    render();
    alert(`Updated ${selected.length} report(s).`);
  } catch (err) {
    console.error(err);
    alert(userError("Couldn't apply the edit: " + err.message, 'MASS_EDIT'));
  } finally {
    btn.disabled = false;
  }
});

init().then(wireAutoPull);

// A background auto-pull landed new report data -- re-fetch and re-render
// so a teammate's new/changed report shows up without a manual reload.
window.addEventListener('company-data-pulled', async () => {
  allReports = await getReportsForProject(project.id);
  render();
});
</script>
</body>
</html>
