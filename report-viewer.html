<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.gstatic.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://www.gstatic.com https://*.googleapis.com https://api.open-meteo.com https://geocoding-api.open-meteo.com; worker-src 'self' blob:; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self';">
<title>Report Viewer</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1c3d5a">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Daily Reports">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="print-sheet.css">
<script src="theme.js"></script>
</head>
<body>

<header class="app-header">
  <button type="button" class="hamburger-btn" id="hamburger-btn" aria-label="Menu" aria-expanded="false">
    <span></span><span></span><span></span>
  </button>
  <div>
    <h1 id="viewer-title">Report</h1>
    <div class="app-sub" id="project-name-sub"></div>
  </div>
  <span></span>
</header>
<div class="back-bar">
  <a href="#" id="bb-back-link">&larr; Reports</a>
  <span class="bb-sep">//</span>
  <span class="bb-cur">Viewing</span>
  <!-- A real navigation to the separate editor page, not an in-place
       unlock -- editing stays its own function, reached deliberately. -->
  <a href="#" id="bb-edit-link" class="btn-sm" style="margin-left:auto;">&#9998; Edit</a>
</div>

<main>
  <!-- Solely the printed page, no click-to-edit, no Save/Generate/Delete --
       editing and downloading are each their own separate, explicit
       actions reachable from reports.html, not something this page leads
       into. The one addition is the review panel below: this IS the
       review page (report-editor.html is for content), so approving/
       commenting belongs here, not a new kind of edit form.

       CONCEPT/PROTOTYPE: adjacent-report carousel. Left = the next day
       with a report, right = the previous day with one (see
       renderSidePanels below for why that ordering, not the more usual
       previous-on-left) -- shown small/faded/blurred, click either to
       transition there without a full page reload. Desktop-only for now
       (see the max-width: 900px rule in style.css) -- there's no room for
       side peeks on a phone-width screen without redesigning this page's
       whole mobile layout, which is out of scope for evaluating the idea
       itself. -->
  <div class="rv-carousel" id="rv-carousel">
    <button type="button" class="rv-side-panel rv-side-left" id="rv-side-left" hidden aria-label="Next day's report"></button>
    <div class="rb-preview-frame" id="rv-preview"></div>
    <button type="button" class="rv-side-panel rv-side-right" id="rv-side-right" hidden aria-label="Previous day's report"></button>
  </div>

  <div class="step" id="rv-review-step" hidden>
    <div class="step-header">
      <span class="step-num">REVIEW</span>
      <h2>Approval</h2>
    </div>
    <div class="step-body">
      <div class="rv-approval-row">
        <span class="rv-approval-badge" id="rv-approval-badge">Pending</span>
        <div class="rv-approval-actions" id="rv-approval-actions" hidden>
          <button type="button" class="btn-sm" id="rv-btn-approve">&#10003; Approve</button>
          <button type="button" class="btn-sm" id="rv-btn-request-changes">&#8635; Request Changes</button>
        </div>
      </div>

      <div id="rv-comments"></div>
      <p class="hint" id="rv-comments-empty" hidden style="margin:0.5rem 0 0;">No comments yet.</p>

      <div id="rv-comment-form" hidden style="margin-top:0.75rem;">
        <label>Add a comment
          <textarea id="rv-comment-text" rows="2" placeholder="Visible to everyone who can see this report"></textarea>
        </label>
        <button type="button" class="btn-sm" id="rv-btn-add-comment" style="margin-top:0.4rem;">Post Comment</button>
      </div>
    </div>
  </div>
</main>

<script src="common.js"></script>
<script src="defaults.js"></script>
<script src="storage.js"></script>
<script src="audit-log.js"></script>
<script src="render-report.js"></script>
<script src="local-sync.js"></script>
<script type="module" src="firebase-init.js"></script>
<script src="firebase-sync.js"></script>
<script>
const projectId = queryParam('project');
const reportId = queryParam('report');

// Same technique report-editor.html's refreshLivePreview uses -- a page
// rendered off-screen-but-attached has a real layout box to measure, a
// bare detached element doesn't.
function scalePreviewPage(pageEl, targetWidthPx) {
  const rect = pageEl.getBoundingClientRect();
  const scale = targetWidthPx / rect.width;
  const wrap = document.createElement('div');
  wrap.className = 'rb-preview-page-wrap';
  wrap.style.width = targetWidthPx + 'px';
  wrap.style.height = Math.round(rect.height * scale) + 'px';
  pageEl.style.transform = `scale(${scale})`;
  pageEl.style.transformOrigin = 'top left';
  wrap.appendChild(pageEl);
  return wrap;
}

async function renderPreview(layout, report, logoBlob) {
  const previewEl = $('#rv-preview');
  const sandbox = document.createElement('div');
  sandbox.style.cssText = 'position:fixed; top:0; left:-20000px; z-index:-1;';
  document.body.appendChild(sandbox);
  const pages = renderReportPages(sandbox, layout, report, logoBlob);
  const frameStyle = getComputedStyle(previewEl);
  const paddingX = parseFloat(frameStyle.paddingLeft) + parseFloat(frameStyle.paddingRight);
  const targetWidth = Math.max(200, previewEl.clientWidth - paddingX);
  const wraps = pages.map(({ el }) => scalePreviewPage(el, targetWidth));
  sandbox.remove();
  previewEl.innerHTML = '';
  wraps.forEach((wrap) => previewEl.appendChild(wrap));
}

// ---------- Concept: adjacent-report carousel ----------
//
// Only the first page of a side report renders (never the multi-page full
// set the main preview shows) -- it's just there to say "this is the one
// next to it", not to be read, and skipping the rest keeps each side
// render cheap. Doesn't fetch that report's photos/signature either (same
// reasoning); a lazily-pulled company report shows blank photo slots in
// the small blurred thumbnail, which is fine there and gets resolved the
// normal way the moment it actually becomes the current report.
const SIDE_THUMB_WIDTH = 150;

async function findAdjacentReports(project, current, room) {
  const all = (await getReportsForProject(project.id)).filter((r) => reportInScope(r, room));
  const sorted = all.slice().sort((a, b) => (
    (a.date || '').localeCompare(b.date || '') || (Number(a.reportNo) || 0) - (Number(b.reportNo) || 0)
  ));
  const idx = sorted.findIndex((r) => r.id === current.id);
  return {
    prevReport: idx > 0 ? sorted[idx - 1] : null,
    nextReport: idx >= 0 && idx < sorted.length - 1 ? sorted[idx + 1] : null,
  };
}

async function renderSidePanel(btn, sideReport, layout, logoBlob, onPick) {
  btn.onclick = null;
  if (!sideReport) {
    btn.hidden = true;
    btn.innerHTML = '';
    return;
  }
  const sandbox = document.createElement('div');
  sandbox.style.cssText = 'position:fixed; top:0; left:-20000px; z-index:-1;';
  document.body.appendChild(sandbox);
  const pages = renderReportPages(sandbox, layout, sideReport, logoBlob);
  const wrap = scalePreviewPage(pages[0].el, SIDE_THUMB_WIDTH);
  sandbox.remove();
  btn.innerHTML = '';
  btn.appendChild(wrap);
  const label = document.createElement('span');
  label.className = 'rv-side-label';
  label.textContent = `#${sideReport.reportNo} · ${sideReport.date || 'no date'}`;
  btn.appendChild(label);
  btn.hidden = false;
  btn.onclick = () => onPick(sideReport);
}

// User's own spec for this concept: next day's report on the LEFT,
// previous day's on the RIGHT -- not the more usual reading-order
// left-to-right-through-time. Kept exactly as asked rather than
// "corrected" to the usual convention.
async function renderSidePanels(project, current, layout, logoBlob, room, onPick) {
  const { prevReport, nextReport } = await findAdjacentReports(project, current, room);
  await Promise.all([
    renderSidePanel($('#rv-side-left'), nextReport, layout, logoBlob, onPick),
    renderSidePanel($('#rv-side-right'), prevReport, layout, logoBlob, onPick),
  ]);
}

let activeProject = null;
let printLayoutCache = null;
let reportLogoCache = null;

// Everything that has to happen to actually show a report on this page --
// pulled out of the old top-level IIFE so both the first load and every
// later carousel click (loadAndShowReport, below) run the exact same path
// instead of two copies drifting apart.
async function loadAndShowReport(id, { includeDeleted = false } = {}) {
  const room = await getCompanyRoom();
  let report = await getReport(id, { includeDeleted: true });
  if (!report || report.projectId !== activeProject.id || !reportInScope(report, room)) {
    location.href = `reports.html?project=${activeProject.id}`;
    return null;
  }
  if (report.deleted && !includeDeleted) {
    // Only the very first load (reportId from the URL) is allowed to be a
    // trashed report -- see the original includeDeleted comment below. A
    // carousel click can never land on one: findAdjacentReports already
    // filters getReportsForProject down to active reports only, so this
    // is just a defensive backstop, not a real path.
    location.href = `reports.html?project=${activeProject.id}`;
    return null;
  }

  if ((report.photosFetched || []).some((f) => !f) || report.signatureFetched === false) {
    $('#viewer-title').textContent = 'Loading photos…';
    report = await fetchReportMedia(report);
    // putReportRaw, not saveReport -- viewing a report shouldn't bump
    // updatedAt or restamp lastEditedBy as if it had been edited.
    await putReportRaw(report);
  }

  document.title = `Report #${report.reportNo} — ${activeProject.name}`;
  $('#viewer-title').textContent = `Report #${report.reportNo} - ${report.date || ''}${report.deleted ? ' (Deleted)' : ''}`;
  if (report.deleted) {
    // report-editor.html only ever looks up active reports, so linking
    // there for a trashed one would just silently bounce back to the
    // reports list -- restore it from Trash first, then edit.
    $('#bb-edit-link').hidden = true;
  } else {
    $('#bb-edit-link').hidden = false;
    // Always shown, same as reports.html's own Edit link -- report-editor.html
    // itself is what gates on permission (lockReportEditor), not this page.
    $('#bb-edit-link').href = `report-editor.html?project=${activeProject.id}&report=${report.id}`;
  }

  try {
    if (!printLayoutCache) printLayoutCache = await loadPrintLayout();
    if (reportLogoCache === null) reportLogoCache = (await getReportLogo()) || undefined;
    await renderPreview(printLayoutCache, report, reportLogoCache);
    if (!report.deleted) {
      await renderSidePanels(activeProject, report, printLayoutCache, reportLogoCache, room, (sideReport) => {
        transitionToReport(sideReport);
      });
    } else {
      $('#rv-side-left').hidden = true;
      $('#rv-side-right').hidden = true;
    }
  } catch (err) {
    console.error(err);
    $('#rv-preview').innerHTML = '<p class="hint">Preview unavailable.</p>';
  }

  if (!report.deleted) {
    await initReviewPanel(report);
  } else {
    $('#rv-review-step').hidden = true;
  }
  return report;
}

// The click animation: shrink/fade the current main preview out, swap in
// the picked report (no full page navigation -- fetching + re-rendering
// happens while the frame is invisible, mid-transition), then scale/fade
// it back in from very slightly enlarged. history.pushState so the URL
// (and Back button) reflect the report actually being viewed, matching
// what a hard navigation would have left behind -- popstate just does a
// plain reload rather than reversing the animation, a deliberate
// concept-stage simplification, not a finished Back experience.
let transitioning = false;
async function transitionToReport(sideReport) {
  if (transitioning) return;
  transitioning = true;
  const frame = $('#rv-preview');
  frame.style.transition = 'opacity 0.22s ease, transform 0.22s ease';
  frame.style.opacity = '0';
  frame.style.transform = 'scale(0.94)';
  await new Promise((resolve) => setTimeout(resolve, 220));

  history.pushState(null, '', `report-viewer.html?project=${activeProject.id}&report=${sideReport.id}`);
  await loadAndShowReport(sideReport.id);

  frame.style.transition = 'none';
  frame.style.transform = 'scale(1.05)';
  frame.style.opacity = '0';
  // Force the browser to paint the pre-transition state above before
  // switching the transition back on -- without this, the browser can
  // coalesce both style changes into one paint and skip the enter
  // animation entirely.
  void frame.offsetWidth;
  frame.style.transition = 'opacity 0.24s ease, transform 0.24s ease';
  frame.style.opacity = '1';
  frame.style.transform = 'scale(1)';
  transitioning = false;
}
window.addEventListener('popstate', () => location.reload());

(async () => {
  const room = await getCompanyRoom();
  const project = projectId ? await getProject(projectId) : null;
  if (!project || !projectInScope(project, room)) {
    location.href = 'index.html';
    return;
  }
  activeProject = project;
  $('#project-name-sub').textContent = project.name;
  $('#bb-back-link').href = `reports.html?project=${project.id}`;
  $('#bb-back-link').addEventListener('click', (e) => {
    e.preventDefault();
    goBackOrFallback(e.currentTarget.href);
  });

  // includeDeleted: this is the "View" link from the Trash section on
  // reports.html, which only ever links here with a trashed report's own
  // id -- read-only either way, same as any other report, so there's
  // nothing extra to gate on beyond the usual scope check right below.
  await loadAndShowReport(reportId, { includeDeleted: true });
})();

const APPROVAL_LABELS = {
  approved: 'Approved',
  changes_requested: 'Changes Requested',
};

function formatCommentTime(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  if (isNaN(d)) return '';
  return d.toLocaleString();
}

function renderReviewPanel(report) {
  const status = report.approvalStatus || 'pending';
  const badge = $('#rv-approval-badge');
  badge.textContent = APPROVAL_LABELS[status] || 'Pending';
  badge.className = `rv-approval-badge rv-${status}`;

  const comments = report.comments || [];
  const list = $('#rv-comments');
  list.innerHTML = '';
  comments.forEach((c) => {
    const item = document.createElement('div');
    item.className = 'rv-comment';
    const head = document.createElement('div');
    head.className = 'rv-comment-head';
    const author = document.createElement('span');
    author.className = 'rv-comment-author';
    author.textContent = c.author || 'Unknown';
    const time = document.createElement('span');
    time.textContent = formatCommentTime(c.createdAt);
    head.appendChild(author);
    head.appendChild(time);
    const text = document.createElement('div');
    text.className = 'rv-comment-text';
    text.textContent = c.text || '';
    item.appendChild(head);
    item.appendChild(text);
    list.appendChild(item);
  });
  $('#rv-comments-empty').hidden = comments.length > 0;
}

async function initReviewPanel(report) {
  $('#rv-review-step').hidden = false;
  renderReviewPanel(report);

  const canApprove = await companyCan('approveReports');
  $('#rv-approval-actions').hidden = !canApprove;
  $('#rv-comment-form').hidden = !canApprove;
  if (!canApprove) return;

  async function applyApproval(patch) {
    report = await saveReportApproval(report.id, patch);
    renderReviewPanel(report);
  }

  // .onclick, not addEventListener -- this now runs again on every
  // carousel navigation (loadAndShowReport), and these three buttons are
  // static elements that persist across it; addEventListener would stack
  // a new listener (closed over the now-superseded `report`) on top of
  // every previous one instead of replacing it.
  $('#rv-btn-approve').onclick = () => applyApproval({ status: 'approved' });
  $('#rv-btn-request-changes').onclick = () => applyApproval({ status: 'changes_requested' });
  $('#rv-btn-add-comment').onclick = async () => {
    const textEl = $('#rv-comment-text');
    const text = textEl.value.trim();
    if (!text) return;
    await applyApproval({ comment: text });
    textEl.value = '';
  };
}
</script>
</body>
</html>
