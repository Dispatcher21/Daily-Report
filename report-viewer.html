<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Unlike every other page (all forms, where a stray pinch mid-typing is
     just annoying), this one is nothing but a read-only report a phone
     screen is genuinely too small to read comfortably -- maximum-scale=1
     there blocks the exact pinch-to-zoom someone would reach for, so this
     page alone allows it. -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.gstatic.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://www.gstatic.com https://*.googleapis.com https://api.open-meteo.com https://geocoding-api.open-meteo.com; worker-src 'self' blob:; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self';">
<title>Report Viewer</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1c3d5a">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Daily Reports">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="print-sheet.css">
<script src="theme.js"></script>
</head>
<body>

<header class="app-header">
  <button type="button" class="hamburger-btn" id="hamburger-btn" aria-label="Menu" aria-expanded="false">
    <span></span><span></span><span></span>
  </button>
  <div>
    <h1 id="viewer-title">Report</h1>
    <div class="app-sub" id="project-name-sub"></div>
  </div>
  <span></span>
</header>
<div class="back-bar">
  <a href="#" id="bb-back-link">&larr; Reports</a>
  <span class="bb-sep">//</span>
  <span class="bb-cur">Viewing</span>
  <!-- A real navigation to the separate editor page, not an in-place
       unlock -- editing stays its own function, reached deliberately. -->
  <a href="#" id="bb-edit-link" class="btn-sm" style="margin-left:auto;">&#9998; Edit</a>
</div>

<main>
  <!-- Solely the printed page, no click-to-edit, no Save/Generate/Delete --
       editing and downloading are each their own separate, explicit
       actions reachable from reports.html, not something this page leads
       into. The one addition is the review panel below: this IS the
       review page (report-editor.html is for content), so approving/
       commenting belongs here, not a new kind of edit form.

       CONCEPT/PROTOTYPE: adjacent-report carousel. Left = the next day
       with a report, right = the previous day with one (see
       renderSidePanels below for why that ordering, not the more usual
       previous-on-left) -- shown small/faded/blurred, click either to
       transition there without a full page reload. Desktop-only for now
       (see the max-width: 900px rule in style.css) -- there's no room for
       side peeks on a phone-width screen without redesigning this page's
       whole mobile layout, which is out of scope for evaluating the idea
       itself. -->
  <div class="rv-carousel" id="rv-carousel">
    <button type="button" class="rv-side-panel rv-side-left" id="rv-side-left" hidden aria-label="Next day's report"></button>
    <div class="rb-preview-frame" id="rv-preview"></div>
    <button type="button" class="rv-side-panel rv-side-right" id="rv-side-right" hidden aria-label="Previous day's report"></button>
    <!-- Mobile stand-in for the side peeks above, which need real room on
         either side of the report that a phone screen doesn't have (see the
         max-width: 900px rule in style.css). Plain previous/next arrows,
         ordinary reading-order convention (left = previous, right = next) --
         unlike the side peeks, there's no thumbnail here to carry the
         concept's own reversed ordering, so this just does what a nav
         arrow is expected to do. -->
    <button type="button" class="rv-mobile-nav rv-mobile-nav-prev" id="rv-mobile-nav-prev" hidden aria-label="Previous report">&#8592;</button>
    <button type="button" class="rv-mobile-nav rv-mobile-nav-next" id="rv-mobile-nav-next" hidden aria-label="Next report">&#8594;</button>
  </div>

  <!-- A floating footer, not a normal in-flow card (see style.css) --
       collapsed to just its header by default (see #rv-review-toggle
       below): the full panel took up a lot of screen just sitting there,
       and most visits don't need it open. Tap/click the header to expand;
       once open, the approval row and composer stay put while just the
       comment list in between scrolls, so both "what's the status" and
       "add a comment" are always reachable without hunting for them at
       the bottom of a long report + long comment thread. -->
  <div class="step rv-collapsed" id="rv-review-step" hidden>
    <div class="step-header" id="rv-review-toggle">
      <span class="step-num">REVIEW</span>
      <h2>Approvals / Comments</h2>
      <span class="rv-approval-badge rv-header-badge" id="rv-header-badge" hidden></span>
      <span class="step-chevron">&#9656;</span>
    </div>
    <div class="step-body" id="rv-review-body">
      <div class="rv-approval-row">
        <span class="rv-approval-badge" id="rv-approval-badge">Pending</span>
        <div class="rv-approval-actions" id="rv-approval-actions" hidden>
          <button type="button" class="btn-sm" id="rv-btn-approve">&#10003; Approve</button>
          <button type="button" class="btn-sm" id="rv-btn-request-changes">&#8635; Request Changes</button>
        </div>
      </div>

      <div class="rv-comments-scroll" id="rv-comments-scroll">
        <div id="rv-comments"></div>
        <p class="hint" id="rv-comments-empty" hidden style="margin:0.5rem 0 0;">No comments yet.</p>
      </div>

      <div id="rv-comment-form" hidden>
        <label>Add a comment
          <textarea id="rv-comment-text" rows="2" placeholder="Visible to everyone who can see this report"></textarea>
        </label>
        <div class="rv-pin-row">
          <button type="button" class="btn-sm" id="rv-btn-pin-toggle">&#128205; Pin a spot on the report</button>
          <button type="button" class="btn-sm" id="rv-btn-pin-clear" hidden>Clear pin</button>
        </div>
        <button type="button" class="btn-sm" id="rv-btn-add-comment" style="margin-top:0.4rem;">Post Comment</button>
      </div>
    </div>
  </div>
</main>

<script src="common.js"></script>
<script src="defaults.js"></script>
<script src="storage.js"></script>
<script src="audit-log.js"></script>
<script src="render-report.js"></script>
<script src="local-sync.js"></script>
<script type="module" src="firebase-init.js"></script>
<script src="firebase-sync.js"></script>
<script>
const projectId = queryParam('project');
const reportId = queryParam('report');

// Same technique report-editor.html's refreshLivePreview uses -- a page
// rendered off-screen-but-attached has a real layout box to measure, a
// bare detached element doesn't.
function scalePreviewPage(pageEl, targetWidthPx) {
  const rect = pageEl.getBoundingClientRect();
  const scale = targetWidthPx / rect.width;
  const wrap = document.createElement('div');
  wrap.className = 'rb-preview-page-wrap';
  wrap.style.width = targetWidthPx + 'px';
  wrap.style.height = Math.round(rect.height * scale) + 'px';
  pageEl.style.transform = `scale(${scale})`;
  pageEl.style.transformOrigin = 'top left';
  wrap.appendChild(pageEl);
  return wrap;
}

async function renderPreview(layout, report, logoBlob) {
  const previewEl = $('#rv-preview');
  const sandbox = document.createElement('div');
  sandbox.style.cssText = 'position:fixed; top:0; left:-20000px; z-index:-1;';
  document.body.appendChild(sandbox);
  const pages = renderReportPages(sandbox, layout, report, logoBlob);
  const frameStyle = getComputedStyle(previewEl);
  const paddingX = parseFloat(frameStyle.paddingLeft) + parseFloat(frameStyle.paddingRight);
  const targetWidth = Math.max(200, previewEl.clientWidth - paddingX);
  const wraps = pages.map(({ el }) => scalePreviewPage(el, targetWidth));
  sandbox.remove();
  previewEl.innerHTML = '';
  // dataset.pageIndex is what ties a dropped/rendered pin back to which
  // printed page it's on -- see the pin-drop feature below.
  wraps.forEach((wrap, i) => {
    wrap.dataset.pageIndex = i;
    previewEl.appendChild(wrap);
  });
  return targetWidth;
}

// ---------- Concept: adjacent-report carousel ----------
//
// Only the first page of a side report renders (never the multi-page full
// set the main preview shows) -- it's just there to say "this is the one
// next to it", not to be read, and skipping the rest keeps each side
// render cheap. Doesn't fetch that report's photos/signature either (same
// reasoning); a lazily-pulled company report shows blank photo slots in
// the small blurred thumbnail, which is fine there and gets resolved the
// normal way the moment it actually becomes the current report.
//
// Sized as a fraction of the main report's own current width, not a fixed
// pixel value -- 70% "the main report, just a bit smaller", matching how
// it should feel next to whatever size the main preview happens to be
// rendering at (screen width, zoom, etc.) rather than looking randomly
// larger/smaller than it in some viewports.
const SIDE_THUMB_SCALE = 0.7;
// How much of each side panel should actually peek out past the main
// report's edge, in real pixels -- NOT a fixed fraction of the panel's own
// (now much larger, 70%-of-main) width. <main> itself caps out at
// min(1400px, 94vw) (see style.css), so at plenty of common desktop widths
// there's only 40-60px of page margin outside it on each side -- a
// percentage-based sliver sized off the panel's own width would routinely
// try to peek out further than that margin actually allows, pushing the
// arrow badge (and part of the thumbnail) off past the edge of the
// viewport entirely rather than just looking cropped. Sized in
// renderSidePanels, per side, off however much room that side of the
// screen genuinely has.
const SIDE_SLIVER_TARGET = 140;
const SIDE_SLIVER_MIN = 50; // below this, not a usable click target -- hide the panel instead of showing a sliver too thin to matter
const SIDE_SLIVER_MARGIN_BUFFER = 16; // breathing room between the sliver's outer edge and the actual viewport edge

async function findAdjacentReports(project, current, room) {
  const all = (await getReportsForProject(project.id)).filter((r) => reportInScope(r, room));
  const sorted = all.slice().sort((a, b) => (
    (a.date || '').localeCompare(b.date || '') || (Number(a.reportNo) || 0) - (Number(b.reportNo) || 0)
  ));
  const idx = sorted.findIndex((r) => r.id === current.id);
  return {
    prevReport: idx > 0 ? sorted[idx - 1] : null,
    nextReport: idx >= 0 && idx < sorted.length - 1 ? sorted[idx + 1] : null,
  };
}

async function renderSidePanel(btn, sideReport, layout, logoBlob, onPick, arrowDir, thumbWidth, sliverWidth) {
  btn.onclick = null;
  if (!sideReport || sliverWidth < SIDE_SLIVER_MIN) {
    btn.hidden = true;
    btn.innerHTML = '';
    return;
  }
  const sandbox = document.createElement('div');
  sandbox.style.cssText = 'position:fixed; top:0; left:-20000px; z-index:-1;';
  document.body.appendChild(sandbox);
  const pages = renderReportPages(sandbox, layout, sideReport, logoBlob);
  const wrap = scalePreviewPage(pages[0].el, thumbWidth);
  sandbox.remove();
  btn.innerHTML = '';
  btn.appendChild(wrap);
  // How far to shift this panel so only `sliverWidth` real px still peek
  // out past the main report's edge -- and where the arrow badge/label
  // need to sit (the middle of that same sliver) to actually land on the
  // visible part of the panel instead of the ~80% of it tucked behind the
  // main report on purpose (the "looking through a stack" effect). Set as
  // custom properties (style.css reads them) rather than fixed CSS values
  // because both depend on the actual on-screen margin, which varies by
  // viewport width -- see the SIDE_SLIVER_TARGET comment above.
  btn.style.setProperty('--rv-hide-px', `${thumbWidth - sliverWidth}px`);
  btn.style.setProperty('--rv-sliver-px', `${sliverWidth}px`);
  // A round arrow badge over the thumbnail -- the fade/blur/shrink alone
  // read as "a preview of something", not obviously "click to go here",
  // so this is the more literal "this is a nav control" cue on top of it.
  const arrow = document.createElement('span');
  arrow.className = 'rv-side-arrow';
  arrow.setAttribute('aria-hidden', 'true');
  arrow.textContent = arrowDir === 'left' ? '←' : '→';
  btn.appendChild(arrow);
  const label = document.createElement('span');
  label.className = 'rv-side-label';
  label.textContent = `#${sideReport.reportNo} · ${sideReport.date || 'no date'}`;
  btn.appendChild(label);
  btn.hidden = false;
  btn.onclick = () => onPick(sideReport);
}

// User's own spec for this concept: next day's report on the LEFT,
// previous day's on the RIGHT -- not the more usual reading-order
// left-to-right-through-time. Kept exactly as asked rather than
// "corrected" to the usual convention.
async function renderSidePanels(project, current, layout, logoBlob, room, onPick, mainWidth) {
  const { prevReport, nextReport } = await findAdjacentReports(project, current, room);
  const thumbWidth = Math.round(mainWidth * SIDE_THUMB_SCALE);

  // Real page margin on each side of the main report, right now -- not
  // assumed from CSS, measured, so this stays correct through browser
  // resizes, zoom, or a narrower/wider window than whatever this was last
  // tuned against.
  const mainRect = $('#rv-preview').getBoundingClientRect();
  const leftMargin = mainRect.left;
  const rightMargin = window.innerWidth - mainRect.right;
  const leftSliver = Math.min(SIDE_SLIVER_TARGET, Math.max(0, leftMargin - SIDE_SLIVER_MARGIN_BUFFER));
  const rightSliver = Math.min(SIDE_SLIVER_TARGET, Math.max(0, rightMargin - SIDE_SLIVER_MARGIN_BUFFER));

  await Promise.all([
    renderSidePanel($('#rv-side-left'), nextReport, layout, logoBlob, onPick, 'left', thumbWidth, leftSliver),
    renderSidePanel($('#rv-side-right'), prevReport, layout, logoBlob, onPick, 'right', thumbWidth, rightSliver),
  ]);
  renderMobileNav(prevReport, nextReport, onPick);
}

// The mobile arrows' own wiring -- separate from renderSidePanel above
// since these have no thumbnail to render, just a show/hide and a click
// target. Kept in sync with the exact same prevReport/nextReport the side
// peeks use so the two navigation methods can never disagree about what's
// actually adjacent.
function renderMobileNav(prevReport, nextReport, onPick) {
  const prevBtn = $('#rv-mobile-nav-prev');
  const nextBtn = $('#rv-mobile-nav-next');
  prevBtn.hidden = !prevReport;
  prevBtn.onclick = prevReport ? () => onPick(prevReport) : null;
  nextBtn.hidden = !nextReport;
  nextBtn.onclick = nextReport ? () => onPick(nextReport) : null;
}

let activeProject = null;
let printLayoutCache = null;
let reportLogoCache = null;

// Everything that has to happen to actually show a report on this page --
// pulled out of the old top-level IIFE so both the first load and every
// later carousel click (loadAndShowReport, below) run the exact same path
// instead of two copies drifting apart.
async function loadAndShowReport(id, { includeDeleted = false } = {}) {
  const room = await getCompanyRoom();
  let report = await getReport(id, { includeDeleted: true });
  if (!report || report.projectId !== activeProject.id || !reportInScope(report, room)) {
    location.href = `reports.html?project=${activeProject.id}`;
    return null;
  }
  if (report.deleted && !includeDeleted) {
    // Only the very first load (reportId from the URL) is allowed to be a
    // trashed report -- see the original includeDeleted comment below. A
    // carousel click can never land on one: findAdjacentReports already
    // filters getReportsForProject down to active reports only, so this
    // is just a defensive backstop, not a real path.
    location.href = `reports.html?project=${activeProject.id}`;
    return null;
  }

  if ((report.photosFetched || []).some((f) => !f) || report.signatureFetched === false) {
    $('#viewer-title').textContent = 'Loading photos…';
    report = await fetchReportMedia(report);
    // putReportRaw, not saveReport -- viewing a report shouldn't bump
    // updatedAt or restamp lastEditedBy as if it had been edited.
    await putReportRaw(report);
  }

  document.title = `Report #${report.reportNo} — ${activeProject.name}`;
  $('#viewer-title').textContent = `Report #${report.reportNo} - ${report.date || ''}${report.deleted ? ' (Deleted)' : ''}`;
  if (report.deleted) {
    // report-editor.html only ever looks up active reports, so linking
    // there for a trashed one would just silently bounce back to the
    // reports list -- restore it from Trash first, then edit.
    $('#bb-edit-link').hidden = true;
  } else {
    $('#bb-edit-link').hidden = false;
    // Always shown, same as reports.html's own Edit link -- report-editor.html
    // itself is what gates on permission (lockReportEditor), not this page.
    $('#bb-edit-link').href = `report-editor.html?project=${activeProject.id}&report=${report.id}`;
  }

  try {
    if (!printLayoutCache) printLayoutCache = await loadPrintLayout();
    if (reportLogoCache === null) reportLogoCache = (await getReportLogo()) || undefined;
    const mainWidth = await renderPreview(printLayoutCache, report, reportLogoCache);
    if (!report.deleted) {
      await renderSidePanels(activeProject, report, printLayoutCache, reportLogoCache, room, (sideReport) => {
        transitionToReport(sideReport);
      }, mainWidth);
    } else {
      $('#rv-side-left').hidden = true;
      $('#rv-side-right').hidden = true;
      $('#rv-mobile-nav-prev').hidden = true;
      $('#rv-mobile-nav-next').hidden = true;
    }
  } catch (err) {
    console.error(err);
    $('#rv-preview').innerHTML = '<p class="hint">Preview unavailable.</p>';
  }

  if (!report.deleted) {
    await initReviewPanel(report);
  } else {
    $('#rv-review-step').hidden = true;
    syncMainBottomPadding();
  }
  return report;
}

// The click animation: shrink/fade the current main preview out, swap in
// the picked report (no full page navigation -- fetching + re-rendering
// happens while the frame is invisible, mid-transition), then scale/fade
// it back in from very slightly enlarged. history.pushState so the URL
// (and Back button) reflect the report actually being viewed, matching
// what a hard navigation would have left behind -- popstate just does a
// plain reload rather than reversing the animation, a deliberate
// concept-stage simplification, not a finished Back experience.
let transitioning = false;
async function transitionToReport(sideReport) {
  if (transitioning) return;
  transitioning = true;
  const frame = $('#rv-preview');
  frame.style.transition = 'opacity 0.22s ease, transform 0.22s ease';
  frame.style.opacity = '0';
  frame.style.transform = 'scale(0.94)';
  await new Promise((resolve) => setTimeout(resolve, 220));

  history.pushState(null, '', `report-viewer.html?project=${activeProject.id}&report=${sideReport.id}`);
  await loadAndShowReport(sideReport.id);

  frame.style.transition = 'none';
  frame.style.transform = 'scale(1.05)';
  frame.style.opacity = '0';
  // Force the browser to paint the pre-transition state above before
  // switching the transition back on -- without this, the browser can
  // coalesce both style changes into one paint and skip the enter
  // animation entirely.
  void frame.offsetWidth;
  frame.style.transition = 'opacity 0.24s ease, transform 0.24s ease';
  frame.style.opacity = '1';
  frame.style.transform = 'scale(1)';
  transitioning = false;
}
window.addEventListener('popstate', () => location.reload());

(async () => {
  const room = await getCompanyRoom();
  const project = projectId ? await getProject(projectId) : null;
  if (!project || !projectInScope(project, room)) {
    location.href = 'index.html';
    return;
  }
  activeProject = project;
  $('#project-name-sub').textContent = project.name;
  $('#bb-back-link').href = `reports.html?project=${project.id}`;
  $('#bb-back-link').addEventListener('click', (e) => {
    e.preventDefault();
    goBackOrFallback(e.currentTarget.href);
  });

  // includeDeleted: this is the "View" link from the Trash section on
  // reports.html, which only ever links here with a trashed report's own
  // id -- read-only either way, same as any other report, so there's
  // nothing extra to gate on beyond the usual scope check right below.
  await loadAndShowReport(reportId, { includeDeleted: true });
})();

const APPROVAL_LABELS = {
  approved: 'Approved',
  changes_requested: 'Changes Requested',
};

function formatCommentTime(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  if (isNaN(d)) return '';
  return d.toLocaleString();
}

let rvCanApprove = false;

// ---------- Pin-drop comments ----------
//
// Lets a commenter point at a specific spot on the printed report instead
// of just describing it in words -- "the rebar spacing here" with an
// actual "here". A pin is { page, x, y }: which printed page (0-indexed,
// matches .rb-preview-page-wrap's own dataset.pageIndex from renderPreview)
// and where on it, x/y as 0-1 fractions of that page's rendered
// width/height rather than raw pixels, so it lands in the same spot
// whether it's redrawn on a phone or a wide desktop window.
let pinModeActive = false;
let pendingPin = null;

function clamp01(n) { return Math.max(0, Math.min(1, n)); }

// The button's own label/state -- separate from the actual marker (see
// renderPendingPinMarker) since this also has to reflect "armed, waiting
// for a tap" even before there's anything to draw yet.
function updatePinToggleUI() {
  const toggleBtn = $('#rv-btn-pin-toggle');
  const clearBtn = $('#rv-btn-pin-clear');
  const preview = $('#rv-preview');
  preview.classList.toggle('rv-pin-armed', pinModeActive);
  clearBtn.hidden = !pendingPin;
  if (pinModeActive) {
    toggleBtn.textContent = '\u{1F4CD} Tap the report where you mean…';
    toggleBtn.classList.add('active');
  } else if (pendingPin) {
    toggleBtn.textContent = '\u{1F4CD} Pinned – tap to move';
    toggleBtn.classList.remove('active');
  } else {
    toggleBtn.textContent = '\u{1F4CD} Pin a spot on the report';
    toggleBtn.classList.remove('active');
  }
}

// The marker that follows the pin while it's still just a draft (not
// posted yet) -- visually distinct (dashed, amber) from the solid numbered
// markers renderCommentPins draws for actual posted comments below, so a
// pin-in-progress never looks like it's already attached to something.
function renderPendingPinMarker() {
  $$('.rv-pin-pending', $('#rv-preview')).forEach((el) => el.remove());
  if (!pendingPin) return;
  const wrap = $$('.rb-preview-page-wrap', $('#rv-preview'))[pendingPin.page];
  if (!wrap) return;
  const marker = document.createElement('div');
  marker.className = 'rv-pin-marker rv-pin-pending';
  marker.style.left = `${pendingPin.x * 100}%`;
  marker.style.top = `${pendingPin.y * 100}%`;
  marker.setAttribute('aria-hidden', 'true');
  wrap.appendChild(marker);
}

// Delegated (not per-marker) since .rb-preview-page-wrap elements are torn
// down and rebuilt on every renderPreview -- this listener, attached once
// to the (persistent) #rv-preview frame itself, keeps working across every
// one of those without needing to be re-wired.
$('#rv-preview').addEventListener('click', (e) => {
  if (!pinModeActive) return;
  const wrap = e.target.closest('.rb-preview-page-wrap');
  if (!wrap) return;
  const rect = wrap.getBoundingClientRect();
  pendingPin = {
    page: Number(wrap.dataset.pageIndex || 0),
    x: clamp01((e.clientX - rect.left) / rect.width),
    y: clamp01((e.clientY - rect.top) / rect.height),
  };
  pinModeActive = false;
  updatePinToggleUI();
  renderPendingPinMarker();
});

// The solid, numbered markers for comments that already have a pin --
// numbered in the same order they appear in the comment list below, so
// "comment 3" and "pin 3" always refer to each other. Redrawn from
// scratch alongside the comment list itself (see renderReviewPanel)
// rather than tracked incrementally, since both are cheap to fully
// rebuild and this way they can never drift out of sync with each other.
function renderCommentPins(report) {
  const preview = $('#rv-preview');
  $$('.rv-pin-marker:not(.rv-pin-pending)', preview).forEach((el) => el.remove());
  const wraps = $$('.rb-preview-page-wrap', preview);
  let n = 0;
  (report.comments || []).forEach((c) => {
    if (!c.pin) return;
    n += 1;
    const wrap = wraps[c.pin.page];
    if (!wrap) return;
    const marker = document.createElement('button');
    marker.type = 'button';
    marker.className = 'rv-pin-marker';
    marker.style.left = `${c.pin.x * 100}%`;
    marker.style.top = `${c.pin.y * 100}%`;
    marker.textContent = String(n);
    marker.title = c.text || '';
    marker.setAttribute('aria-label', `Comment ${n}: ${c.text || ''}`);
    marker.dataset.commentId = c.id;
    marker.onclick = () => focusComment(c.id);
    wrap.appendChild(marker);
  });
}

// Pin -> comment (clicking a marker on the report) and comment -> pin
// (clicking a comment's own "View on report" button) both land here or in
// focusPin below -- expand the panel/scroll to the report as needed, then
// a brief highlight flash so the eye actually catches which one just
// became relevant, since a scroll alone is easy to miss.
function flashHighlight(el) {
  if (!el) return;
  el.classList.remove('rv-flash');
  void el.offsetWidth;
  el.classList.add('rv-flash');
}

function focusComment(commentId) {
  $('#rv-review-step').classList.remove('rv-collapsed');
  syncMainBottomPadding();
  const item = $(`.rv-comment[data-comment-id="${commentId}"]`);
  if (!item) return;
  item.scrollIntoView({ behavior: 'smooth', block: 'center' });
  flashHighlight(item);
}

function focusPin(commentId) {
  const marker = $(`.rv-pin-marker[data-comment-id="${commentId}"]`);
  if (!marker) return;
  marker.scrollIntoView({ behavior: 'smooth', block: 'center' });
  flashHighlight(marker);
}

function renderReviewPanel(report) {
  const status = report.approvalStatus || 'pending';
  const badge = $('#rv-approval-badge');
  badge.textContent = APPROVAL_LABELS[status] || 'Pending';
  badge.className = `rv-approval-badge rv-${status}`;
  // Same status, shown in the collapsed header itself -- see style.css's
  // .rv-header-badge comment for why this exists alongside the one above
  // rather than just reusing it directly (that one lives inside .step-body,
  // which is display:none while collapsed).
  const headerBadge = $('#rv-header-badge');
  headerBadge.textContent = badge.textContent;
  headerBadge.className = `rv-approval-badge rv-header-badge rv-${status}`;
  headerBadge.hidden = false;

  const comments = report.comments || [];
  const list = $('#rv-comments');
  list.innerHTML = '';
  let pinNum = 0;
  comments.forEach((c) => {
    const item = document.createElement('div');
    item.className = 'rv-comment';
    item.dataset.commentId = c.id;
    const head = document.createElement('div');
    head.className = 'rv-comment-head';
    // Author + pin badge grouped together so .rv-comment-head's own
    // space-between (author-side vs. time-side) still only ever splits
    // two things -- a third top-level flex child here would instead
    // spread all three apart evenly, stranding the pin badge in the
    // middle of the row.
    const left = document.createElement('span');
    left.className = 'rv-comment-head-left';
    const author = document.createElement('span');
    author.className = 'rv-comment-author';
    author.textContent = c.author || 'Unknown';
    left.appendChild(author);
    if (c.pin) {
      pinNum += 1;
      const pinBtn = document.createElement('button');
      pinBtn.type = 'button';
      pinBtn.className = 'rv-comment-pin-btn';
      pinBtn.textContent = `\u{1F4CD} ${pinNum}`;
      pinBtn.title = 'Show where this points to on the report';
      pinBtn.onclick = () => focusPin(c.id);
      left.appendChild(pinBtn);
    }
    head.appendChild(left);
    const time = document.createElement('span');
    time.textContent = formatCommentTime(c.createdAt);
    head.appendChild(time);
    const text = document.createElement('div');
    text.className = 'rv-comment-text';
    text.textContent = c.text || '';
    item.appendChild(head);
    item.appendChild(text);
    if (rvCanApprove) {
      const del = document.createElement('button');
      del.type = 'button';
      del.className = 'rv-comment-delete';
      del.title = 'Delete comment';
      del.setAttribute('aria-label', 'Delete comment');
      del.textContent = '×';
      del.onclick = async () => {
        if (!confirm('Delete this comment?')) return;
        const updated = await deleteReportComment(report.id, c.id);
        report = updated;
        renderReviewPanel(report);
      };
      item.appendChild(del);
    }
    list.appendChild(item);
  });
  $('#rv-comments-empty').hidden = comments.length > 0;
  renderCommentPins(report);
  syncMainBottomPadding();
}

// #rv-review-step floats fixed over the bottom of the page now (see
// style.css) instead of taking up its own space in normal flow -- without
// this, its own footer would just permanently cover whatever's underneath
// it (the tail of the report preview, or the carousel's side reports).
// Re-measured on every render because its height isn't fixed: more
// comments, a wrapped approval row, or a window resize (comment text
// reflowing) can all change how tall it actually is.
function syncMainBottomPadding() {
  const main = document.querySelector('main');
  const step = $('#rv-review-step');
  main.style.paddingBottom = step.hidden ? '' : `${step.getBoundingClientRect().height + 16}px`;
}
window.addEventListener('resize', syncMainBottomPadding);

// Collapsed to just the header by default (see the .rv-collapsed class
// already on #rv-review-step in the markup) -- .onclick, not
// addEventListener, since #rv-review-toggle is a static element that
// persists across every carousel navigation (loadAndShowReport runs
// initReviewPanel again each time), same reasoning as the approve/comment
// buttons below.
$('#rv-review-toggle').onclick = () => {
  $('#rv-review-step').classList.toggle('rv-collapsed');
  syncMainBottomPadding();
};

async function initReviewPanel(report) {
  $('#rv-review-step').hidden = false;
  // A pin dropped for the last report has no meaning on this one --
  // reset before renderReviewPanel/renderCommentPins run for the new
  // report (loadAndShowReport calls this again on every carousel
  // navigation, same page instance).
  pinModeActive = false;
  pendingPin = null;
  updatePinToggleUI();
  // Needs to be known before the first renderReviewPanel call -- it decides
  // whether each comment gets a delete button.
  rvCanApprove = await companyCan('approveReports');
  renderReviewPanel(report);

  const canApprove = rvCanApprove;
  $('#rv-approval-actions').hidden = !canApprove;
  $('#rv-comment-form').hidden = !canApprove;
  if (!canApprove) return;

  async function applyApproval(patch) {
    report = await saveReportApproval(report.id, patch);
    renderReviewPanel(report);
  }

  // .onclick, not addEventListener -- this now runs again on every
  // carousel navigation (loadAndShowReport), and these three buttons are
  // static elements that persist across it; addEventListener would stack
  // a new listener (closed over the now-superseded `report`) on top of
  // every previous one instead of replacing it.
  $('#rv-btn-approve').onclick = () => applyApproval({ status: 'approved' });
  $('#rv-btn-request-changes').onclick = () => applyApproval({ status: 'changes_requested' });
  $('#rv-btn-pin-toggle').onclick = () => {
    pinModeActive = !pinModeActive;
    updatePinToggleUI();
  };
  $('#rv-btn-pin-clear').onclick = () => {
    pendingPin = null;
    pinModeActive = false;
    updatePinToggleUI();
    renderPendingPinMarker();
  };
  $('#rv-btn-add-comment').onclick = async () => {
    const textEl = $('#rv-comment-text');
    const text = textEl.value.trim();
    if (!text) return;
    await applyApproval({ comment: text, pin: pendingPin });
    textEl.value = '';
    pendingPin = null;
    pinModeActive = false;
    updatePinToggleUI();
    renderPendingPinMarker();
  };
}
</script>
</body>
</html>
