<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.gstatic.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://www.gstatic.com https://*.googleapis.com https://api.open-meteo.com https://geocoding-api.open-meteo.com; worker-src 'self' blob:; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self';">
<title>Project Settings</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1c3d5a">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Daily Reports">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="print-sheet.css">
<script src="theme.js"></script>
<script src="lib/heic2any.min.js"></script>
<style>
  main { padding-bottom: 2rem; }
  /* Section list | one section | the printed report (only beside the
     sections that change it). */
  .ps-layout { display: grid; grid-template-columns: 15rem minmax(0, 1fr) minmax(300px, 400px); gap: 1.25rem; align-items: start; }
  .ps-layout.ps-noprint { grid-template-columns: 15rem minmax(0, 1fr); }
  .ps-left { min-width: 0; display: grid; gap: 1rem; }
  .ps-right { min-width: 0; display: flex; flex-direction: column; gap: 0.5rem; position: sticky; top: 1rem; }
  .ps-right[hidden] { display: none; }
  .ps-right h3 { margin: 0; font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-dim); }
  #ps-report-preview { display: flex; justify-content: center; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 0.75rem; }
  .ps-report-preview-wrap { position: relative; overflow: hidden; border: 1px solid var(--border); margin: 0 auto; }
  .ps-nav { position: sticky; top: 1rem; display: grid; gap: 0.15rem; }
  .ps-nav button { display: grid; grid-template-columns: 1.6rem minmax(0, 1fr); gap: 0 0.5rem; text-align: left; border: 0; background: none; border-radius: var(--radius-sm); padding: 0.55rem 0.7rem; color: var(--text); font: inherit; cursor: pointer; }
  .ps-nav button:hover { background: var(--surface-3); }
  .ps-nav button[aria-current="true"] { background: var(--surface); box-shadow: var(--shadow); }
  .ps-nav button[aria-current="true"] .psn-t { color: var(--link); }
  .psn-i { grid-row: span 2; font-size: 1.05rem; line-height: 1.5; }
  .psn-t { font-weight: 800; }
  .psn-s { font-size: 0.78rem; color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .psn-s.psn-warn { color: var(--warn); font-weight: 700; }
  .psn-sep { height: 1px; background: var(--border); margin: 0.4rem 0.5rem; }
  .psn-danger .psn-t { color: var(--danger); }
  .ps-head h2 { margin: 0; font-size: 1.3rem; text-wrap: balance; }
  .ps-head p { margin: 0.2rem 0 0; color: var(--text-dim); font-size: 0.92rem; max-width: 62ch; }
  #ps-panel { display: grid; gap: 1rem; min-width: 0; }
  .ps-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 1rem; display: grid; gap: 0.7rem; min-width: 0; }
  .ps-card h3 { margin: 0; font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-dim); }
  .ps-card .field-grid { margin: 0; row-gap: 0.9rem; }
  .ps-card label { margin-bottom: 0; }
  .ps-full { grid-column: 1 / -1; }
  .ps-calc { font-size: 0.86rem; background: var(--surface-2); border-radius: var(--radius-sm); padding: 0.5rem 0.65rem; color: var(--text-dim); }
  .ps-calc b { color: var(--text); }
  .ps-disc { border-top: 1px solid var(--border); padding-top: 0.75rem; }
  .ps-disc > button { border: 0; background: none; padding: 0; font: inherit; font-weight: 800; color: var(--link); cursor: pointer; display: flex; gap: 0.5rem; align-items: center; }
  .ps-disc > button span { color: var(--text-dim); font-weight: 600; font-size: 0.85rem; }
  .ps-cardhead { display: flex; justify-content: space-between; align-items: center; gap: 0.6rem; flex-wrap: wrap; }
  .ps-slots { display: grid; gap: 0.4rem; }
  .ps-slots-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 1rem; }
  .ps-slot { display: grid; grid-template-columns: 2rem minmax(0, 1fr); gap: 0.5rem; align-items: center; }
  .ps-slot i { font-style: normal; font-weight: 800; color: var(--text-dim); text-align: right; font-variant-numeric: tabular-nums; }
  .ps-slot input { min-height: 0; padding: 0.45rem 0.6rem; }
  .ps-seg { display: inline-flex; border: 1.5px solid var(--border); border-radius: var(--radius-sm); overflow: hidden; flex: none; }
  .ps-seg button { border: 0; background: var(--surface); color: var(--text); padding: 0.35rem 0.75rem; font: inherit; font-weight: 700; font-size: 0.85rem; cursor: pointer; }
  .ps-seg button + button { border-left: 1px solid var(--border); }
  .ps-seg button[aria-pressed="true"] { background: var(--brand); color: var(--on-brand); }
  .ps-seg button.ps-seg-req[aria-pressed="true"] { background: var(--warn); color: var(--surface); }
  .ps-seg button.ps-seg-hid[aria-pressed="true"] { background: var(--text-dim); color: var(--surface); }
  .ps-fgroup { display: grid; gap: 0.1rem; }
  .ps-fgroup h4 { margin: 0.4rem 0 0.2rem; font-size: 0.92rem; }
  .ps-frow { display: flex; gap: 0.75rem; align-items: center; justify-content: space-between; padding: 0.4rem 0; border-top: 1px solid var(--border); }
  .ps-frow > span:first-child { min-width: 0; }
  .ps-frow-hidden > span:first-child { color: var(--text-dim); text-decoration: line-through; }
  .ps-icons { display: flex; flex-wrap: wrap; gap: 0.4rem; }
  .ps-icons button { width: 2.6rem; height: 2.6rem; border-radius: var(--radius-sm); border: 1.5px solid var(--border); background: var(--surface); font-size: 1.25rem; cursor: pointer; }
  .ps-icons button[aria-pressed="true"] { border-color: var(--brand); box-shadow: 0 0 0 2px var(--brand-dim); }
  .ps-bgprev { height: 8rem; border-radius: var(--radius-sm); border: 1.5px dashed var(--border); display: grid; place-items: center; color: var(--text-dim); font-size: 0.9rem; background-color: var(--surface-2); background-size: cover; background-position: center; }
  .ps-row { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; }
  .ps-row .btn-secondary, .ps-filerow .btn-secondary { width: auto; margin: 0; }
  .ps-filebtn { display: inline-flex; flex-direction: row; cursor: pointer; color: var(--text); font-size: inherit; }
  .ps-filerow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0.75rem; align-items: center; padding: 0.75rem 0; border-top: 1px solid var(--border); }
  .ps-filerow:first-child { border-top: 0; padding-top: 0; }
  .ps-filerow b { display: block; }
  .ps-filerow span { font-size: 0.86rem; color: var(--text-dim); }
  .ps-dangercard { border-color: var(--danger); background: var(--danger-bg); }
  .ps-dangercard h3 { color: var(--danger); }
  .ps-dangercard .btn-danger { width: auto; }
  .ps-checkbox-label { flex-direction: row !important; align-items: center; gap: 0.5rem !important; }
  .ps-checkbox-label input { width: 1.35rem; flex-shrink: 0; }
  #ps-add-item { margin-bottom: 0.5rem; width: auto; }
  .psi-list { display: grid; gap: 0.5rem; margin-bottom: 0.8rem; }
  .psi-item { border: 1.5px solid var(--border); border-radius: var(--radius-sm); background: var(--surface); }
  .psi-item.open { border-color: var(--brand-light); }
  .psi-line { display: flex; align-items: center; gap: 0.7rem; width: 100%; border: 0; background: none; color: var(--text); text-align: left; padding: 0.6rem 0.75rem; font: inherit; cursor: pointer; }
  .psi-num { font-weight: 800; flex: none; }
  .psi-desc { flex: 1; min-width: 0; color: var(--text-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .psi-chev { color: var(--text-dim); font-size: 0.8rem; }
  .psi-unit { font-size: 0.75rem; font-weight: 800; border-radius: 999px; padding: 0.15rem 0.55rem; background: var(--surface-3); color: var(--text-dim); white-space: nowrap; }
  .psi-unit-std { background: var(--brand-dim); color: var(--link); }
  .psi-unit-need { background: var(--warn-bg); color: var(--warn); }
  .psi-body { display: grid; gap: 0.3rem; padding: 0.85rem 0.85rem 0.8rem; border-top: 1px solid var(--border); }
  .psi-sect { display: grid; gap: 0.1rem; }
  .psi-sect h3 { margin: 0.2rem 0 0.4rem; font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-dim); }
  .psi-chips { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-bottom: 0.6rem; }
  .psi-chip { border: 1.5px solid var(--border); background: var(--surface); color: var(--text); border-radius: 999px; padding: 0.3rem 0.75rem; font: inherit; font-weight: 700; font-size: 0.84rem; cursor: pointer; }
  .psi-chip[aria-pressed="true"] { background: var(--brand); border-color: var(--brand); color: var(--on-brand); }
  .psi-chip[aria-pressed="true"]::before { content: "\2713  "; }
  .psi-confirm { border: 1.5px solid var(--warn-border); background: var(--warn-bg); border-radius: var(--radius); padding: 0.8rem 0.9rem; display: grid; gap: 0.6rem; margin-bottom: 0.9rem; }
  .psi-confirm h2 { margin: 0; font-size: 1rem; color: var(--warn); }
  .psi-confirm p { margin: 0; font-size: 0.86rem; color: var(--text-dim); }
  .psi-crow { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 14rem) auto; gap: 0.6rem; align-items: center; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 0.5rem 0.65rem; }
  .psi-what { min-width: 0; }
  .psi-what b { display: block; }
  .psi-what span { font-size: 0.8rem; color: var(--text-dim); }
  .psi-crow select { min-height: 0; padding: 0.45rem 0.55rem; }
  .psi-note { grid-column: 1 / -1; font-size: 0.8rem; color: var(--warn); font-weight: 700; }
  #psi-confirm-all { justify-self: start; }
  @media (max-width: 560px) { .psi-crow { grid-template-columns: minmax(0, 1fr); } }

  @media (max-width: 1150px) {
    .ps-layout, .ps-layout.ps-noprint { grid-template-columns: 13rem minmax(0, 1fr); }
    .ps-right { display: none !important; }
  }
  @media (max-width: 760px) {
    .ps-layout, .ps-layout.ps-noprint { grid-template-columns: minmax(0, 1fr); }
    .ps-nav { position: static; display: flex; overflow-x: auto; gap: 0.35rem; padding-bottom: 0.3rem; }
    .ps-nav button { grid-template-columns: auto; padding: 0.45rem 0.85rem; border: 1.5px solid var(--border); border-radius: 999px; white-space: nowrap; }
    .psn-i, .psn-s, .psn-sep { display: none; }
    .ps-slots-2 { grid-template-columns: minmax(0, 1fr); }
    .ps-frow, .ps-filerow { grid-template-columns: minmax(0, 1fr); flex-wrap: wrap; }
  }
</style>
</head>
<body>

<header class="app-header">
  <button type="button" class="hamburger-btn" id="hamburger-btn" aria-label="Menu" aria-expanded="false">
    <span></span><span></span><span></span>
  </button>
  <div>
    <h1>Project Settings</h1>
    <div class="app-sub" id="project-name-sub"></div>
  </div>
  <span></span>
</header>
<div class="back-bar">
  <span id="bb-trail"></span>
</div>

<main>
  <div class="ps-layout" id="ps-layout">
    <nav class="ps-nav" id="ps-nav" aria-label="Settings sections"></nav>
    <div class="ps-left">
      <div id="ps-panel"></div>
    </div>
    <aside class="ps-right" id="ps-right">
      <h3>How it prints</h3>
      <div id="ps-report-preview"><p class="hint">Loading preview&hellip;</p></div>
    </aside>
  </div>
</main>

<div class="floating-save-bar" id="fsb">
  <span class="fsb-status" id="fsb-status">Unsaved changes</span>
  <button type="button" class="btn-primary" id="fsb-save" disabled>Save</button>
</div>

<script src="lib/xlsx.min.js"></script>
<script src="lib/fflate.min.js"></script>
<script src="lib/html2canvas.min.js"></script>
<script src="lib/jspdf.umd.min.js"></script>
<script src="common.js"></script>
<script src="defaults.js"></script>
<script src="storage.js"></script>
<script src="audit-log.js"></script>
<script src="project-file.js"></script>
<script src="report-bundle.js"></script>
<script src="pdf-export.js"></script>
<script src="local-sync.js"></script>
<script src="render-report.js"></script>
<script type="module" src="firebase-init.js"></script>
<script src="firebase-sync.js"></script>
<script>
const PS_FIELD_TYPES = {
  ntpDate: 'date',
  contractLength: 'number',
  trafficControlSelect: 'select',
  workSummary: 'textarea',
};
const TRAFFIC_CONTROL_OPTIONS = [
  { value: '', label: '(none)' },
  { value: 'IN_PLACE', label: 'In Place' },
  { value: 'ATTENTION_REQUIRED', label: 'Attention Required' },
];

let project = null;
let layout = null;
let logoBlob = null;
let previewTimer = null;
let dirty = false;

function trimTrailingBlanks(arr) {
  const out = arr.slice();
  while (out.length && !out[out.length - 1]) out.pop();
  return out;
}

// Edits are held in memory only until Save is pressed -- the report preview
// (in-memory, no storage round trip) still updates live as you type, but
// nothing is persisted, and the dashboard preview doesn't reload, until then.
function markDirty() {
  dirty = true;
  $('#fsb').classList.add('show');
  $('#fsb-save').disabled = false;
}

async function saveNow() {
  const btn = $('#fsb-save');
  btn.disabled = true;
  btn.textContent = 'Saving...';
  project.defaultContractors = trimTrailingBlanks(project.defaultContractors || []);
  project.defaultEquipmentLabels = trimTrailingBlanks(project.defaultEquipmentLabels || []);
  await saveProject(project);
  $('#project-name-sub').textContent = project.name;
  dirty = false;
  $('#fsb-status').textContent = 'Saved.';
  $('#fsb').classList.remove('show');
  btn.textContent = 'Save';
  renderNav();
}

$('#fsb-save').addEventListener('click', saveNow);

$('#bb-trail').addEventListener('click', (e) => {
  const link = e.target.closest('a');
  if (!link) return;
  if (dirty && !confirm('You have unsaved changes. Discard them?')) e.preventDefault();
});
window.addEventListener('beforeunload', (e) => {
  if (dirty) { e.preventDefault(); e.returnValue = ''; }
});

function schedulePreviewRefresh() {
  clearTimeout(previewTimer);
  previewTimer = setTimeout(refreshReportPreview, 250);
}

// ---------- Sections ----------
//
// Every project setting in one place: a section list on the left, one
// section at a time, and the printed report beside the sections that
// change it. Who sees what is the same as before this page took over the
// project page's own settings panel: Info / Pay Items / Contractors need
// "edit projects" (others get Info read-only); Report Form and Icon &
// Background are admins only; Files & Backup is everyone (uploading a
// replacement project file needs "edit projects"); Delete needs "edit
// projects".

let canEdit = false;
let isAdmin = false;
let psSection = 'info';
let psShowDefaults = false;

const PS_SECTIONS = [
  { id: 'info', icon: '\u{1F4CB}', title: 'Project Info', prints: true, show: () => true, render: () => renderInfoSection(),
    sum: () => {
      const m = project.meta || {};
      return m.ntpDate ? `NTP ${psFmtDate(m.ntpDate)}${m.contractLength ? ` · ${m.contractLength} days` : ''}` : 'Start here';
    } },
  { id: 'pay', icon: '\u{1F4CA}', title: 'Pay Items', show: () => canEdit, render: () => renderPayItemsTab(),
    sum: () => {
      const items = (project.payItemCatalog || []).filter((c) => c.itemNumber || c.description);
      const check = items.filter(payItemUnitNeedsConfirm).length;
      return `${items.length} item${items.length === 1 ? '' : 's'}${check ? ` · ${check} unit${check === 1 ? '' : 's'} to check` : ''}`;
    },
    warn: () => (project.payItemCatalog || []).some((c) => (c.itemNumber || c.description) && payItemUnitNeedsConfirm(c)) },
  { id: 'crew', icon: '\u{1F477}', title: 'Contractors & Equipment', prints: true, show: () => canEdit, render: () => renderCrewSection(),
    sum: () => {
      const n = (project.defaultContractors || []).filter((c) => String(c || '').trim()).length;
      return `${n} contractor${n === 1 ? '' : 's'} · ${psCustomEquipment() ? 'own' : 'standard'} equipment`;
    } },
  { id: 'form', icon: '\u{1F4DD}', title: 'Report Form', show: () => isAdmin, render: () => renderFormSection(),
    sum: () => `${(project.requiredFields || []).length} required · ${(project.hiddenFields || []).length} hidden` },
  { id: 'look', icon: '\u{1F3A8}', title: 'Icon & Background', show: () => isAdmin, render: () => renderLookSection(),
    sum: () => `${project.icon || '\u{1F4C1}'}${project.backgroundImage ? ' · background photo' : ''}` },
  { id: 'files', icon: '\u{1F4C1}', title: 'Files & Backup', show: () => true, render: () => renderFilesSection(),
    sum: () => 'Excel file, import, sync' },
  'sep',
  { id: 'delete', icon: '\u{1F5D1}\u{FE0F}', title: 'Delete Project', danger: true, show: () => canEdit, render: () => renderDeleteSection(),
    sum: () => 'Permanent' },
];

function psFmtDate(iso) {
  const d = new Date(`${iso}T12:00:00`);
  return Number.isNaN(d.getTime()) ? iso : d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
}

function renderNav() {
  $('#ps-nav').innerHTML = PS_SECTIONS.filter((s) => s === 'sep' || s.show()).map((s) => (s === 'sep'
    ? '<div class="psn-sep" role="presentation"></div>'
    : `<button type="button" data-sec="${s.id}" aria-current="${psSection === s.id}"${s.danger ? ' class="psn-danger"' : ''}><span class="psn-i" aria-hidden="true">${s.icon}</span><span class="psn-t">${escapeHtml(s.title)}</span><span class="psn-s${s.warn && s.warn() ? ' psn-warn' : ''}">${escapeHtml(s.sum())}</span></button>`)).join('');
}

function renderActivePanel() {
  const s = PS_SECTIONS.find((x) => x !== 'sep' && x.id === psSection && x.show()) || PS_SECTIONS[0];
  psSection = s.id;
  renderNav();
  s.render();
  $('#ps-layout').classList.toggle('ps-noprint', !s.prints);
  $('#ps-right').hidden = !s.prints;
  if (s.prints) schedulePreviewRefresh();
}

$('#ps-nav').addEventListener('click', (e) => {
  const btn = e.target.closest('[data-sec]');
  if (!btn) return;
  psSection = btn.dataset.sec;
  renderActivePanel();
  window.scrollTo({ top: 0 });
});

function psHead(title, text) {
  return `<div class="ps-head"><h2>${escapeHtml(title)}</h2>${text ? `<p>${text}</p>` : ''}</div>`;
}

// ---------- Project Info ----------

// The "starting text" keys: the rest of PROJECT_INFO_FIELDS, minus the two
// that are only kept for old files (the Work Summary top line follows
// Activity now, and the Short Work Summary is retired).
const PS_BASIC_KEYS = ['name', 'projectNo', 'projectName', 'location', 'ntpDate', 'contractLength', 'representative', 'peName'];
const PS_RETIRED_KEYS = ['workSummaryHeader', 'trafficControlNote'];

function psEndText() {
  const m = project.meta || {};
  const days = parseInt(m.contractLength, 10);
  if (!m.ntpDate || !(days > 0)) return 'Fill in the NTP date and contract length to see when the contract ends.';
  const start = new Date(`${m.ntpDate}T12:00:00`);
  if (Number.isNaN(start.getTime())) return '';
  const end = new Date(start);
  end.setDate(end.getDate() + days);
  const today = new Date();
  today.setHours(12, 0, 0, 0);
  const used = Math.round((today - start) / 86400000);
  const endTxt = end.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
  if (used < 0) return `Ends <b>${endTxt}</b> · starts in ${-used} day${used === -1 ? '' : 's'}`;
  const left = days - used;
  return `Ends <b>${endTxt}</b> · day ${used} of ${days} · <b>${left >= 0 ? `${left} day${left === 1 ? '' : 's'} left` : `${-left} day${left === -1 ? '' : 's'} over`}</b>`;
}

function renderInfoSection() {
  const m = project.meta || (project.meta = {});
  const dis = canEdit ? '' : ' disabled';
  const fld = (key, label, opts = {}) => {
    const val = key === 'name' ? project.name || '' : m[key] || '';
    const type = PS_FIELD_TYPES[key] || 'text';
    let control;
    if (type === 'select') {
      control = `<select data-meta-key="${key}"${dis}>${TRAFFIC_CONTROL_OPTIONS.map((o) => `<option value="${o.value}"${o.value === val ? ' selected' : ''}>${o.label}</option>`).join('')}</select>`;
    } else if (type === 'textarea') {
      control = `<textarea data-meta-key="${key}" rows="3"${dis}>${escapeHtml(val)}</textarea>`;
    } else {
      control = `<input type="${type}" ${key === 'name' ? 'id="ps-name"' : `data-meta-key="${key}"`} value="${escapeHtml(val)}"${opts.ph ? ` placeholder="${escapeHtml(opts.ph)}"` : ''}${dis}>`;
    }
    return `<label${opts.full || type === 'textarea' ? ' class="ps-full"' : ''}>${escapeHtml(label)}${control}${opts.hint ? `<span class="hint" style="margin:0">${opts.hint}</span>` : ''}</label>`;
  };
  const defaults = PROJECT_INFO_FIELDS.filter((f) => !PS_BASIC_KEYS.includes(f.key) && !PS_RETIRED_KEYS.includes(f.key));
  const filled = defaults.filter((f) => String(m[f.key] || '').trim()).length;
  const label = (f) => f.label.replace(/^DEFAULT /, '').toLowerCase().replace(/^\w/, (c) => c.toUpperCase());
  $('#ps-panel').innerHTML = `
    ${psHead('Project Info', `What prints at the top of every report, and the dates the dashboard counts from.${canEdit ? '' : ' Only people who can edit projects can change these.'}`)}
    <div class="ps-card">
      <h3>The project</h3>
      <div class="field-grid">
        ${fld('name', 'Name in the app', { full: true, hint: 'Shown on the home screen and the project list.', ph: 'Shown on the project list' })}
        ${fld('projectNo', 'Project No.')}

// ---------- Report Form ----------
//
// The same three settings the visual editor (required-fields.html) sets:
// requiredFields (REQUIRED_FIELD_DEFS keys), hiddenFields (whole blocks,
// ORDERABLE_FIELD_DEFS keys). Contractors and Equipment are one block on
// the form, so hiding either hides both; each can be required on its own.

function psFormRows() {
  const rows = [];
  REPORT_BUILDER_GROUPS.forEach((g) => {
    const items = [];
    g.keys.forEach((key) => {
      if (key === 'contractorsEquipment') {
        items.push({ req: 'contractors', hide: key, label: 'Contractors (at least one named)' });
        items.push({ req: 'equipmentRows', hide: key, label: 'Equipment (a quantity entered)' });
        return;
      }
      const def = REQUIRED_FIELD_DEFS.find((d) => d.key === key);
      const od = ORDERABLE_FIELD_DEFS.find((d) => d.key === key);
      if (def || od) items.push({ req: def ? key : null, hide: od ? key : null, label: (def || od).label });
    });
    if (items.length) rows.push({ group: g.label, items });
  });
  return rows;
}

function renderFormSection() {
  const req = new Set(project.requiredFields || []);
  const hid = new Set(project.hiddenFields || []);
  $('#ps-panel').innerHTML = `
    ${psHead('Report Form', 'What inspectors must fill in before they can generate a report, and what to leave off the form entirely.')}
    <div class="ps-card">
      ${psFormRows().map((g) => `<div class="ps-fgroup"><h4>${escapeHtml(g.group)}</h4>${g.items.map((it) => {
        const v = it.hide && hid.has(it.hide) ? 'hid' : it.req && req.has(it.req) ? 'req' : 'opt';
        const b = (val, text, cls) => `<button type="button" class="${cls || ''}" data-req="${it.req || ''}" data-hide="${it.hide || ''}" data-v="${val}" aria-pressed="${v === val}">${text}</button>`;
        return `<div class="ps-frow${v === 'hid' ? ' ps-frow-hidden' : ''}"><span>${escapeHtml(it.label)}</span><span class="ps-seg" role="group" aria-label="${escapeHtml(it.label)}">${b('opt', 'Optional')}${it.req ? b('req', 'Required', 'ps-seg-req') : ''}${it.hide ? b('hid', 'Hidden', 'ps-seg-hid') : ''}</span></div>`;
      }).join('')}</div>`).join('')}
      <p class="hint" style="margin:0">To change the order of fields, or pick them by clicking the printed report, use the <a href="required-fields.html?project=${encodeURIComponent(project.id)}" id="ps-visual-link">visual editor</a>.</p>
    </div>`;
  $$('[data-v]', $('#ps-panel')).forEach((btn) => btn.addEventListener('click', () => {
    const r = new Set(project.requiredFields || []);
    const h = new Set(project.hiddenFields || []);
    const { req: rk, hide: hk, v } = btn.dataset;
    if (v === 'hid') {
      h.add(hk);
      // A hidden field can't be filled in, so it can't stay required.
      if (hk === 'contractorsEquipment') { r.delete('contractors'); r.delete('equipmentRows'); } else r.delete(hk);
    } else {
      if (hk) h.delete(hk);
      if (rk) { if (v === 'req') r.add(rk); else r.delete(rk); }
    }
    project.requiredFields = [...r];
    project.hiddenFields = [...h];
    markDirty();
    renderFormSection();
    renderNav();
  }));
}

let psBgUrl = null;
function renderLookSection() {
  if (psBgUrl) { URL.revokeObjectURL(psBgUrl); psBgUrl = null; }

  const current = project.icon || '\u{1F4C1}';
  $('#ps-panel').innerHTML = `
    ${psHead('Icon & Background', 'How this project looks on the home screen.')}

    </div>

      <div class="ps-row">

  $('#ps-bg-upload').addEventListener('change', async (e) => {

    if (!file) return;

  const rm = $('#ps-bg-remove');
  if (rm) rm.addEventListener('click', () => {
    project.backgroundImage = null;
    project.backgroundImageFetched = true;

// ---------- Pay Items tab ----------

// One line per pay item; the open one shows its settings. Units come from
// a fixed list (PAY_UNITS in defaults.js) plus "Other" for any unit of the
// admin's own. Items from before the list (no unitKind) are gathered at the
// top for an admin to confirm, with the app's best match suggested.
let psOpenItem = null;

function psUnitOptions(selected, withBlank) {
  return (withBlank ? `<option value=""${!selected ? ' selected' : ''}>Pick one</option>` : '') +
    PAY_UNITS.map((u) => `<option value="${u.k}"${selected === u.k ? ' selected' : ''}>${u.k} - ${escapeHtml(u.name)}</option>`).join('') +
    `<option value="${PAY_UNIT_OTHER}"${selected === PAY_UNIT_OTHER ? ' selected' : ''}>Other (type your own)</option>`;
}

function psUnitChip(it) {
  const text = it.unit || '';
  if (!it.unitKind && !payItemUnitNeedsConfirm(it)) return `<span class="psi-unit psi-unit-std">${escapeHtml(text)}</span>`;
  if (!it.unitKind) return `<span class="psi-unit psi-unit-need">${escapeHtml(text || 'No unit')} ?</span>`;
  if (it.unitKind === PAY_UNIT_OTHER) return `<span class="psi-unit">${escapeHtml(text || 'Other')}</span>`;
  const same = text.trim().toUpperCase() === it.unitKind;
  return `<span class="psi-unit psi-unit-std">${escapeHtml(text || it.unitKind)}${same || !text ? '' : ` = ${it.unitKind}`}</span>`;
}

function psItemBodyHtml(it, i) {
  const kind = it.unitKind && it.unitKind !== PAY_UNIT_OTHER ? it.unitKind : '';
  const def = payUnitDef(kind || (!it.unitKind ? payItemKind(it, it.unit) : ''));
  const isLS = (it.unitKind ? it.unitKind : payItemKind(it, it.unit)) === 'LS';
  const allowed = Array.isArray(it.calcs) ? it.calcs : def ? def.calcs : [];
  const calcChips = def && def.calcs.length
    ? `<div class="psi-chips">${def.calcs.map((c) => `<button type="button" class="psi-chip" data-psi-calc="${c}" data-idx="${i}" aria-pressed="${allowed.includes(c)}">${escapeHtml(PAY_CALCS[c])}</button>`).join('')}</div>
       ${kind === 'LS' && !(Number(it.unitPrice) > 0) ? '<span class="hint" style="margin:0">Percent complete needs the Lump Sum amount.</span>' : ''}`
    : `<span class="hint" style="margin:0">None for this unit. Inspectors type the quantity.</span>`;
  return `
    <div class="psi-body">
      <div class="field-grid">
        <label>Item Number <input type="text" data-idx="${i}" data-field="itemNumber" value="${escapeHtml(it.itemNumber || '')}"></label>
        <label>Description <input type="text" data-idx="${i}" data-field="description" value="${escapeHtml(it.description || '')}"></label>
      </div>
      <div class="field-grid">
        <label>Unit <select data-idx="${i}" data-psi-unit>${psUnitOptions(it.unitKind || (payItemUnitNeedsConfirm(it) ? '' : payItemKind(it, it.unit)), payItemUnitNeedsConfirm(it))}</select>
          ${payItemUnitNeedsConfirm(it) ? '<span class="hint" style="margin:0">Pick what this unit means (see the list above).</span>' : ''}</label>
        <label>Prints on the report as <input type="text" data-idx="${i}" data-field="unit" value="${escapeHtml(it.unit || '')}">
          <span class="hint" style="margin:0">${it.unitKind === PAY_UNIT_OTHER ? 'Your own unit: inspectors type the quantity, no calculators.' : 'Keeps the contract\'s wording, like LUMP or TONS.'}</span></label>
      </div>
      <div class="field-grid">
        ${isLS
          ? `<label>Lump Sum amount ($) <input type="number" inputmode="decimal" step="0.01" data-idx="${i}" data-field="unitPrice" value="${escapeHtml(it.unitPrice || '')}"><span class="hint" style="margin:0">Inspectors log dollars earned toward this.</span></label><div></div>`
          : `<label>Per Plans Total <input type="number" inputmode="decimal" data-idx="${i}" data-field="plannedQty" value="${escapeHtml(it.plannedQty || '')}"></label>
             <label>Unit Price <input type="number" inputmode="decimal" step="0.01" data-idx="${i}" data-field="unitPrice" value="${escapeHtml(it.unitPrice || '')}"></label>`}
      </div>
      <div class="psi-sect"><h3>Calculators inspectors can use</h3>${calcChips}</div>
      <div class="psi-sect"><h3>Ask inspectors for</h3>
        <label class="ps-checkbox-label"><input type="checkbox" data-idx="${i}" data-field="stations" ${it.stations ? 'checked' : ''}> Start and stop station</label>
        <label class="ps-checkbox-label"><input type="checkbox" data-idx="${i}" data-field="side" ${it.side ? 'checked' : ''}> Side (Lt / Rt / Ctr)</label>
        <label class="ps-checkbox-label"><input type="checkbox" data-idx="${i}" data-field="theoretical" ${it.theoretical ? 'checked' : ''}> Theoretical quantity (shows over or under)</label>
        <label class="ps-checkbox-label"><input type="checkbox" data-idx="${i}" data-field="remarksRequired" ${it.remarksRequired ? 'checked' : ''}> Remarks, required before the report can be generated</label>
        ${!it.unitKind && it.computed ? `<label class="ps-checkbox-label"><input type="checkbox" data-idx="${i}" data-field="computed" checked> Length × Width (from before units; confirm the unit to use its calculators instead)</label>` : ''}
        <label>Locations (one per line, leave blank if not used)<textarea data-idx="${i}" data-field="locations" rows="2">${escapeHtml((it.locations || []).join('\n'))}</textarea></label>
      </div>
      <div class="psi-sect"><h3>Checks</h3>
        <label>Warn when one day's quantity is over <input type="number" inputmode="decimal" data-idx="${i}" data-field="dailyLimit" value="${escapeHtml(it.dailyLimit || '')}" placeholder="No limit" style="max-width:12rem"></label>
        <label class="ps-checkbox-label"><input type="checkbox" data-idx="${i}" data-field="payAppOnly" ${it.payAppOnly ? 'checked' : ''}> Pay App only (hidden from the report form; the quantity comes from Pay Apps)</label>
      </div>
      <button type="button" class="text-btn ps-remove-item" data-idx="${i}" style="color:var(--danger);justify-self:start">&times; Remove This Pay Item</button>
    </div>`;
}

function renderPayItemsTab() {
  const items = project.payItemCatalog || (project.payItemCatalog = []);
  const pending = items.map((it, i) => ({ it, i })).filter(({ it }) => payItemUnitNeedsConfirm(it) && (it.itemNumber || it.description));
  const confirmHtml = pending.length ? `
    <section class="psi-confirm" aria-labelledby="psi-confirm-h">
      <h2 id="psi-confirm-h">Check ${pending.length} unit${pending.length === 1 ? '' : 's'}</h2>
      <p>These units were typed in before the app had a unit list. Pick what each one means so inspectors get the right calculators. Nothing changes until you confirm and save, and the report still prints the unit as typed.</p>
      ${pending.map(({ it, i }) => {
        const guess = matchPayUnit(it.unit);
        return `<div class="psi-crow">
          <div class="psi-what"><b>${escapeHtml(it.itemNumber || '(no number)')} &middot; typed as "${escapeHtml(it.unit || '')}"</b><span>${escapeHtml(it.description || '')}</span></div>
          <select data-psi-guess="${i}" aria-label="What ${escapeHtml(it.unit || 'this unit')} means">${psUnitOptions(guess, !guess)}</select>
          <button type="button" class="btn-sm" data-psi-confirm="${i}">Confirm</button>
          ${guess === 'LS' && payItemKind(it, it.unit) !== 'LS' ? '<div class="psi-note">Lump Sum: once confirmed, quantities on this item count as dollars on the dashboards and Pay Apps.</div>' : ''}
        </div>`;
      }).join('')}
      ${pending.filter(({ it }) => matchPayUnit(it.unit)).length > 1 ? '<button type="button" class="btn-secondary" id="psi-confirm-all">Confirm all suggested</button>' : ''}
    </section>` : '';

  const rowsHtml = items.map((it, i) => {
    const open = psOpenItem === i;
    return `<div class="psi-item${open ? ' open' : ''}" data-idx="${i}">
      <button type="button" class="psi-line" data-psi-open="${i}" aria-expanded="${open}"><span class="psi-num">${escapeHtml(it.itemNumber || 'New item')}</span><span class="psi-desc">${escapeHtml(it.description || '')}</span>${psUnitChip(it)}<span class="psi-chev">${open ? '&#9662;' : '&#9656;'}</span></button>
      ${open ? psItemBodyHtml(it, i) : ''}
    </div>`;
  }).join('');

  $('#ps-panel').innerHTML = `
    <div class="panel-tip-row"><button type="button" class="info-tip" data-tip="Same settings as the PAY ITEMS sheet in the project file. Stations, Side, Theoretical and Locations let an item be logged more than once per report (different segments, sides or spots the same day)." aria-label="What this does">i</button></div>
    ${confirmHtml}
    <div class="psi-list">${rowsHtml || '<p class="hint">No pay items yet.</p>'}</div>
    <button type="button" class="btn-secondary" id="ps-add-item">+ Add Pay Item</button>
  `;

  const panel = $('#ps-panel');
  const changed = (rerender) => {
    markDirty();
    schedulePreviewRefresh();
    if (rerender) renderPayItemsTab();
  };
  $$('[data-field]', panel).forEach((el) => {
    const evt = el.type === 'checkbox' ? 'change' : 'input';
    el.addEventListener(evt, () => {
      const item = items[Number(el.dataset.idx)];
      const field = el.dataset.field;
      if (el.type === 'checkbox') item[field] = el.checked;
      else if (field === 'locations') item.locations = el.value.split('\n').map((s) => s.trim()).filter(Boolean);
      else item[field] = el.value;
      // The line at the top of the item shows the number, description and unit.
      if (['itemNumber', 'description', 'unit'].includes(field)) {
        const line = panel.querySelector(`[data-psi-open="${el.dataset.idx}"]`);
        if (line) {
          line.querySelector('.psi-num').textContent = item.itemNumber || 'New item';
          line.querySelector('.psi-desc').textContent = item.description || '';
          line.querySelector('.psi-unit').outerHTML = psUnitChip(item);
        }
      }
      changed(false);
    });
  });
  // Confirming or changing a unit: what it means, never the printed text
  // (unless there was none).
  const setKind = (i, kind) => {
    const item = items[i];
    item.unitKind = kind || undefined;
    if (!kind) delete item.unitKind;
    if (kind && kind !== PAY_UNIT_OTHER && !String(item.unit || '').trim()) item.unit = kind;
    delete item.calcs;
  };
  $$('[data-psi-unit]', panel).forEach((el) => el.addEventListener('change', () => { setKind(Number(el.dataset.idx), el.value); changed(true); }));
  $$('[data-psi-confirm]', panel).forEach((btn) => btn.addEventListener('click', () => {
    const i = Number(btn.dataset.psiConfirm);
    const v = panel.querySelector(`[data-psi-guess="${i}"]`).value;
    if (!v) { alert('Pick what this unit means first.'); return; }
    setKind(i, v);
    changed(true);
  }));
  const all = $('#psi-confirm-all');
  if (all) all.addEventListener('click', () => {
    pending.forEach(({ i }) => {
      const v = panel.querySelector(`[data-psi-guess="${i}"]`).value;
      if (v) setKind(i, v);
    });
    changed(true);
  });
  $$('[data-psi-open]', panel).forEach((btn) => btn.addEventListener('click', () => {
    const i = Number(btn.dataset.psiOpen);
    psOpenItem = psOpenItem === i ? null : i;
    renderPayItemsTab();
  }));
  $$('[data-psi-calc]', panel).forEach((btn) => btn.addEventListener('click', () => {
    const item = items[Number(btn.dataset.idx)];
    const def = payUnitDef(item.unitKind && item.unitKind !== PAY_UNIT_OTHER ? item.unitKind : payItemKind(item, item.unit));
    if (!def) return;
    const on = new Set(Array.isArray(item.calcs) ? item.calcs : def.calcs);
    if (on.has(btn.dataset.psiCalc)) on.delete(btn.dataset.psiCalc);
    else on.add(btn.dataset.psiCalc);
    // Every one on is the default: stored as no list at all.
    const list = def.calcs.filter((c) => on.has(c));
    if (list.length === def.calcs.length) delete item.calcs;
    else item.calcs = list;
    changed(true);
  }));
  $$('.ps-remove-item', panel).forEach((btn) => {
    btn.addEventListener('click', () => {
      items.splice(Number(btn.dataset.idx), 1);
      psOpenItem = null;
      changed(true);
    });
  });
  $('#ps-add-item').addEventListener('click', () => {
    items.push({ itemNumber: '', description: '', unit: '', plannedQty: '', unitPrice: '', stations: false, locations: [], side: false, computed: false, theoretical: false, payAppOnly: false, unitKind: PAY_UNIT_OTHER });
    psOpenItem = items.length - 1;
    renderPayItemsTab();
  });
}

// ---------- Files & Backup: wiring (moved from the project page) ----------

async function refreshSyncFolderStatus() {
  if (!project) return;
  const btn = $('#btn-sync-folder');
  const status = $('#sync-folder-status');
  if (!folderSyncSupported()) {
    btn.textContent = '⤓ Download Backup Zip';
    status.textContent = 'This browser can’t write to a folder directly -- Sync downloads a backup zip instead.';
    return;
  }
  const folderName = await getLinkedSyncFolderName(project.id);
  if (!folderName) {
    status.textContent = 'Not linked to a folder yet -- Sync will ask you to choose one.';
    return;
  }
  const reports = await getReportsForProject(project.id);
  const state = await getFolderSyncState(project.id);
  const pending = reports.filter((r) => !isReportFolderSynced(r, state)).length;
  status.textContent = pending > 0
    ? `Linked to folder "${folderName}" -- ${pending} report(s) waiting to sync. New saves sync automatically from here on; click Sync to catch these up now.`
    : `Linked to folder "${folderName}". Every report is up to date -- new saves sync automatically.`;
}

function wireFilesSection() {
  $('#btn-download-project-file').addEventListener('click', () => {
    try {
      downloadProjectDataFile(project);
    } catch (err) {
      console.error(err);
      alert(userError("Couldn't build the project file: " + err.message, 'DOWNLOAD_PROJECT_FILE'));
    }
  });

  const reupload = $('#f-reupload');
  if (reupload) reupload.addEventListener('change', async (e) => {
    const file = e.target.files[0];
    e.target.value = '';
    if (!file) return;
    if (dirty) { alert('Save or undo your changes on this page first, then upload the file.'); return; }
    try {
      const parsed = await parseProjectDataFile(file);
      // applyProjectUpdate keeps everything the file doesn't carry
      // (required fields, icon, Pay Apps, pay item settings the file has
      // no column for).
      const candidate = await makeProjectFromParsedFile(parsed);
      await saveProject(applyProjectUpdate(project, candidate));
      project = await getProject(project.id);
      renderActivePanel();
      $('#project-name-sub').textContent = project.name;
      alert('Project updated from ' + file.name + '.');
    } catch (err) {
      console.error(err);
      alert(userError("Couldn't read that file: " + err.message, 'PARSE_EXCEL'));
    }
  });

  $('#btn-sync-folder').addEventListener('click', async () => {
    if (!project) return;
    const btn = $('#btn-sync-folder');
    const status = $('#sync-folder-status');
    btn.disabled = true;
    const originalLabel = btn.textContent;
    try {
      if (folderSyncSupported()) {
        const result = await syncProjectToFolder(project, (done, total) => {
          btn.textContent = `Syncing ${done}/${total}…`;
        });
        status.textContent = `Synced ${result.reportCount} report(s) to folder "${result.folderName}" just now.`;
        // Nothing else updates the global out-of-sync banner (common.js) on
        // its own -- without this, a manual sync from here leaves it showing
        // the pre-sync count until the next full page load.
        window.dispatchEvent(new CustomEvent('folder-sync-completed'));
      } else {
        const { blob, reportCount } = await buildProjectSyncZip(project, (done, total) => {
          btn.textContent = `Building ${done}/${total}…`;
        });
        triggerDownload(blob, projectSyncZipFilename(project));
        status.textContent = `Downloaded a backup zip with ${reportCount} report(s).`;
      }
    } catch (err) {
      if (err.name === 'AbortError') {
        // User closed the folder picker -- not an error worth alerting over.
      } else {
        console.error(err);
        alert(userError("Couldn't sync this project to a folder: " + err.message, 'FOLDER_SYNC'));
      }
    } finally {
      btn.disabled = false;
      btn.textContent = originalLabel;
    }
  });

  $('#f-import-reports').addEventListener('change', async (e) => {
    const files = Array.from(e.target.files || []);
    e.target.value = '';
    if (files.length === 0) return;
  
    const log = $('#ir-log');
    log.hidden = false;
    log.innerHTML = '';
    const onFileDone = (file, outcome) => {
      const syncFailed = outcome.synced === false;
      const detail = outcome.status === 'error' ? outcome.error
        : outcome.status === 'skipped' ? `#${outcome.reportNo} — skipped`
        : `#${outcome.reportNo}${outcome.photoCount ? `, ${outcome.photoCount} photo${outcome.photoCount === 1 ? '' : 's'}` : ''}${outcome.status === 'overwritten' ? ' — overwritten' : ''}${syncFailed ? ' — cloud sync failed, retry with Refresh' : ''}`;
      const cls = outcome.status === 'error' ? 'ir-error' : syncFailed ? 'ir-syncfail' : outcome.status === 'skipped' ? 'ir-dupe' : 'ir-ok';
      const icon = outcome.status === 'error' ? '✗' : (syncFailed || outcome.status === 'skipped') ? '⚠' : '✓';
      log.appendChild(irLogRow(cls, icon, file.name, detail));
      log.scrollTop = log.scrollHeight;
    };
  
    const { added, overwritten, skipped, syncFailed, errors } = await importReportFilesIntoProject(files, undefined, onFileDone);
  
  
    let msg = `Import complete.\n${added} report(s) added, ${overwritten} overwritten, ${skipped} skipped.`;
    if (syncFailed > 0) msg = userError(msg + `\n\n${syncFailed} didn't make it to the company after retrying -- run Refresh on Company Management to finish syncing them.`, 'IMPORT_REPORT_SYNC');
    if (errors.length > 0) msg = userError(msg + `\n\nIssues:\n${errors.join('\n')}`, 'IMPORT_REPORT_BUNDLES');
    alert(msg);
  });
}

// Merges .report bundles AND Daily Work Report Excel files into THIS
// project regardless of which project a .report's embedded project.json
// names -- you're already looking at the project you want them in, so
// that's used instead. Only ever report data, never project data;
// mergeProjectRecord is deliberately never called here. Each file is
// content-sniffed rather than trusted by extension (tryParseReportBundle
// returns null for anything that isn't actually one of this app's own
// bundles, .xlsx included, so it's safe to just try that first and fall
// back to the Excel parser).
//
// A report already on file for the same Report No. is only touched after
// `confirmOverwrite` approves it, and even then a photo slot the incoming
// file leaves empty keeps whatever the existing report already had there
// rather than being cleared -- the old assumption that an incoming file
// "typically" has no photos of its own doesn't hold for an Excel import
// the way it did for a selectively-synced .report bundle.
//
// `confirmOverwrite` is a parameter (defaulting to the real confirm()
// dialog) so tests can drive the merge decision without a real dialog.
// `onFileDone(file, outcome)` -- outcome one of 'added'/'overwritten'/
// 'skipped'/'error' plus whatever detail applies -- is how the real UI
// handler below drives its live per-file log; omitted (and the global
// progress banner left untouched) when this is called from a test.
async function importReportFilesIntoProject(files, confirmOverwrite = (msg) => confirm(msg), onFileDone = null) {
  const existingReports = await getReportsForProject(project.id);
  const existingByNo = new Map(existingReports.filter((r) => r.reportNo != null).map((r) => [String(r.reportNo), r]));

  let added = 0;
  let overwritten = 0;
  let skipped = 0;
  let syncFailed = 0;
  const errors = [];

  if (onFileDone) startProgressBanner();
  if (typeof beginAuditBatch === 'function') beginAuditBatch('via Import');
  for (let i = 0; i < files.length; i++) {
    const file = files[i];
    if (onFileDone) progressStep('import-reports', 'Importing reports', `${i + 1} of ${files.length}`);
    try {
      let incoming;
      const bundle = await tryParseReportBundle(file);
      if (bundle) {
        incoming = bundle.report;
      } else {
        let parsed;
        try {
          parsed = await parseReportExcelFile(file);
        } catch (err) {
          throw new Error(`not a .report bundle or a recognized Daily Work Report Excel file (${err.message})`);
        }
        const compressedPhotos = await Promise.all(parsed.photos.map((p) => (p ? compressImage(p) : null)));
        incoming = reportFromImportedFields(parsed.fields, compressedPhotos, project);
      }
      const existing = existingByNo.get(String(incoming.reportNo));

      if (existing) {
        const label = `Report #${incoming.reportNo}${incoming.date ? ' (' + incoming.date + ')' : ''}`;
        const ok = confirmOverwrite(
          `${label} already exists in this project (currently dated ${existing.date || 'undated'}).\n\nOverwrite it with the imported data? A photo slot the incoming file leaves empty keeps the existing report's photo there instead of being cleared.`
        );
        if (!ok) {
          skipped++;
          if (onFileDone) onFileDone(file, { status: 'skipped', reportNo: incoming.reportNo });
          continue;
        }
        incoming.id = existing.id;
        incoming.photos = (incoming.photos || []).map((p, i2) => p || (existing.photos && existing.photos[i2]) || null);
        incoming.repSignatureImage = incoming.repSignatureImage || existing.repSignatureImage;
        incoming.createdAt = existing.createdAt;
        overwritten++;
      } else {
        added++;
      }

      incoming.projectId = project.id;
      normalizeReport(incoming);
      await saveReport(incoming);
      existingByNo.set(String(incoming.reportNo), incoming);
      // saveReport already fired its own fire-and-forget sync push, but a
      // big batch is exactly the case where a handful of those can fail
      // silently to the console and never be seen -- confirming (with
      // retries) here means a failure shows up in this file's own log row
      // instead of only as a mismatched report count on some other device.
      const synced = await confirmReportPushed(incoming);
      if (!synced) syncFailed++;
      if (onFileDone) {
        onFileDone(file, {
          status: existing ? 'overwritten' : 'added',
          reportNo: incoming.reportNo,
          photoCount: (incoming.photos || []).filter(Boolean).length,
          synced,
        });
      }
    } catch (err) {
      console.error(err);
      errors.push(`${file.name}: ${err.message}`);
      if (onFileDone) onFileDone(file, { status: 'error', error: err.message });
    }
  }
  if (typeof endAuditBatch === 'function') endAuditBatch();

  if (onFileDone) {
    if (errors.length) {
      progressBannerError(userError(`${errors.length} of ${files.length} file(s) couldn't be imported -- see the list below.`, 'IMPORT_REPORT_BUNDLES'));
    } else if (syncFailed) {
      progressBannerError(userError(`${added + overwritten} report(s) saved, but ${syncFailed} didn't make it to the company after retrying -- run Refresh on Company Management to finish syncing them.`, 'IMPORT_REPORT_SYNC'));
    } else {
      finishProgressBanner(`${added} added, ${overwritten} overwritten, ${skipped} skipped.`);
    }
  }

  return { added, overwritten, skipped, syncFailed, errors };
}


// ---------- Live previews ----------

function scalePreviewPage(pageEl, targetWidthPx) {
  const rect = pageEl.getBoundingClientRect();
  const scale = targetWidthPx / Math.max(rect.width, 1);
  const wrap = document.createElement('div');
  wrap.className = 'ps-report-preview-wrap';
  wrap.style.width = targetWidthPx + 'px';
  wrap.style.height = Math.round(rect.height * scale) + 'px';
  pageEl.style.transform = `scale(${scale})`;
  pageEl.style.transformOrigin = 'top left';
  wrap.appendChild(pageEl);
  return wrap;
}

async function refreshReportPreview() {
  const container = $('#ps-report-preview');
  if (!container || !layout) return;
  try {
    const sample = await makeBlankReport(1, project, null);
    // Rendered directly into the visible container, not an offscreen/detached
    // element -- scalePreviewPage measures the page's real layout size via
    // getBoundingClientRect(), which is always 0x0 for anything not actually
    // attached to the document, and that silently collapsed the whole preview
    // to a blank 0-height box.
    container.innerHTML = '';
    const pages = renderReportPages(container, layout, sample, logoBlob);
    pages[1].el.remove();
    await waitForImages(container);
    const targetWidth = Math.min(container.clientWidth || 360, 460);
    const wrap = scalePreviewPage(pages[0].el, targetWidth);
    container.innerHTML = '';
    container.appendChild(wrap);
  } catch (err) {
    console.error(err);
    container.innerHTML = '<p class="hint">Preview unavailable.</p>';
  }
}

// ---------- Init ----------

async function init() {
  const idParam = queryParam('id');
  const room = await getCompanyRoom();
  isAdmin = !!(room && room.isAdmin);
  if (!idParam || idParam === 'new') {
    if (!(await companyCan('createProjects'))) {
      alert("You don't have permission to create projects.");
      location.href = 'index.html';
      return;
    }
    project = await makeProjectFromParsedFile({ meta: {}, payItemCatalog: [], contractors: [], equipmentLabels: [] });
    await saveProject(project);
    history.replaceState(null, '', `project-setup.html?id=${project.id}`);
    canEdit = true; // whoever just created it sets it up
  } else {
    project = await getProject(idParam);
    if (!project || !projectInScope(project, room)) {
      location.href = 'index.html';
      return;
    }
    canEdit = await companyCan('editProjects');
  }
  if (!project.meta) project.meta = {};

  $('#project-name-sub').textContent = project.name;
  renderBreadcrumb('#bb-trail', [
    { label: 'Home', href: 'index.html' },
    { label: project.name, href: `project.html?id=${project.id}` },
    { label: 'Settings' },
  ]);

  // ?section=files etc. opens straight to a section (the project page's
  // links use it).
  const wanted = queryParam('section');
  if (wanted) psSection = wanted;

  [layout, logoBlob] = await Promise.all([loadPrintLayout(), getReportLogo()]);
  renderActivePanel();
}

// No 'company-data-pulled' listener here on purpose -- see the same note in
// report-editor.html. The pull still runs and updates local storage
// silently.
init().then(wireAutoPull);
