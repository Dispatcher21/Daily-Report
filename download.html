<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Download Report</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1c3d5a">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="print-sheet.css">
<style>
  #pdf-preview-wrap {
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    background: #525659;
    height: 70vh;
    min-height: 380px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #pdf-frame { width: 100%; height: 100%; border: 0; display: block; }
  #pdf-status { text-align: center; padding: 2.5rem 1rem; color: #dfe3e6; font-size: 0.9rem; }

  /* Off-screen sandbox: laid out normally (not display:none) so html2canvas
     can measure real geometry, just parked where nobody sees it. */
  #render-sandbox { position: fixed; top: 0; left: -20000px; z-index: -1; }
</style>
</head>
<body>

<header class="app-header">
  <div>
    <h1>Download Report</h1>
    <div class="app-sub" id="project-name-sub"></div>
  </div>
  <span></span>
</header>
<div class="back-bar">
  <a href="#" id="bb-back-link">&larr; Reports</a>
  <span class="bb-sep">//</span>
  <span class="bb-cur">Download</span>
</div>

<main>
  <div class="step">
    <div class="step-header"><span class="step-num">PREVIEW</span><h2 id="preview-title">Preparing your report&hellip;</h2></div>
    <div class="step-body">
      <div id="pdf-preview-wrap">
        <div id="pdf-status">Rendering PDF preview&hellip;</div>
        <iframe id="pdf-frame" title="PDF preview" hidden></iframe>
      </div>
      <div class="export-bar">
        <button type="button" class="btn-primary" id="btn-download-pdf" disabled>Download PDF</button>
      </div>
    </div>
  </div>
</main>

<div id="render-sandbox"></div>

<script src="lib/html2canvas.min.js"></script>
<script src="lib/jspdf.umd.min.js"></script>
<script src="common.js"></script>
<script src="defaults.js"></script>
<script src="storage.js"></script>
<script src="render-report.js"></script>
<script>
const { jsPDF } = window.jspdf;

// Rasterize each sheet at roughly this many dots per inch. The DOM renders at
// 96dpi, so the html2canvas scale needed for a target DPI is TARGET/96 --
// adjusted for the fact that the sheet gets shrunk onto the page. Anything
// much below ~250 turns the 8pt label text into unreadable grey mush.
const TARGET_DPI = 300;

function pdfFilename(reports) {
  const projectNo = (reports[0] && reports[0].projectNo) || 'PR';
  if (reports.length === 1) {
    return `PR${projectNo}_DailyReport_${reports[0].date || 'undated'}.pdf`;
  }
  return `PR${projectNo}_DailyReports_${reports.length}reports.pdf`;
}

// Renders each report's sheets into `sandbox` one at a time, rasterizes each
// at print resolution, and places it on a real US Letter page at the size and
// orientation the template's own page setup asks for.
async function buildPdfBlob(sandbox, layout, reports, onProgress) {
  const captures = [];
  let done = 0;
  const total = reports.length * 2;

  for (const report of reports) {
    const pages = renderReportPages(sandbox, layout, report);
    await waitForImages(sandbox);
    // A rAF-based settle wait can hang indefinitely if the tab is backgrounded
    // (rAF is throttled/suspended when not visible) -- setTimeout still fires.
    await new Promise((resolve) => setTimeout(resolve, 50));

    for (const { el, geom } of pages) {
      // el is laid out at 1pt = 1/72in but the DOM measures in 96dpi px, so
      // its on-screen width is contentW * 96/72. Scaling so the FINAL printed
      // width (geom.drawW points) resolves at TARGET_DPI:
      const targetPx = (geom.drawW / 72) * TARGET_DPI;
      const scale = targetPx / el.offsetWidth;

      const canvas = await html2canvas(el, {
        scale,
        backgroundColor: '#ffffff',
        useCORS: true,
        width: el.offsetWidth,
        height: el.offsetHeight,
      });

      captures.push({ dataUrl: canvas.toDataURL('image/jpeg', 0.94), geom });

      $$('img', el).forEach((img) => {
        if (img.src.startsWith('blob:')) URL.revokeObjectURL(img.src);
      });
      el.remove();
      done++;
      if (onProgress) onProgress(done, total);
    }
  }

  const doc = new jsPDF({
    unit: 'pt',
    format: [captures[0].geom.pageW, captures[0].geom.pageH],
    orientation: captures[0].geom.orientation,
  });
  captures.forEach((cap, i) => {
    const g = cap.geom;
    if (i > 0) doc.addPage([g.pageW, g.pageH], g.orientation);
    doc.addImage(cap.dataUrl, 'JPEG', g.x, g.y, g.drawW, g.drawH);
  });
  return doc.output('blob');
}

(async () => {
  const projectId = queryParam('project');
  const reportIdsParam = queryParam('report') || '';
  const reportIds = reportIdsParam.split(',').filter(Boolean);

  const project = projectId ? await getProject(projectId) : null;
  if (!project || reportIds.length === 0) {
    $('#pdf-status').textContent = 'Nothing to download.';
    return;
  }
  document.title = `Download — ${project.name}`;
  $('#project-name-sub').textContent = project.name;
  $('#bb-back-link').href = `reports.html?project=${project.id}`;

  const reports = [];
  for (const id of reportIds) {
    const r = await getReport(id);
    if (r) reports.push(r);
  }
  if (reports.length === 0) {
    $('#pdf-status').textContent = 'Nothing to download.';
    return;
  }

  $('#preview-title').textContent = reports.length === 1
    ? `Report #${reports[0].reportNo} — ${reports[0].date || ''}`
    : `${reports.length} reports selected`;

  const layout = await loadPrintLayout();
  const sandbox = $('#render-sandbox');

  let pdfBlob;
  try {
    pdfBlob = await buildPdfBlob(sandbox, layout, reports, (done, total) => {
      $('#pdf-status').textContent = `Rendering page ${done} of ${total}…`;
    });
  } catch (err) {
    console.error(err);
    $('#pdf-status').textContent = 'Could not generate the PDF: ' + err.message;
    return;
  }

  const frame = $('#pdf-frame');
  frame.src = URL.createObjectURL(pdfBlob);
  frame.hidden = false;
  $('#pdf-status').hidden = true;

  const btnPdf = $('#btn-download-pdf');
  btnPdf.disabled = false;
  btnPdf.addEventListener('click', () => triggerDownload(pdfBlob, pdfFilename(reports)));
})();
</script>
</body>
</html>
