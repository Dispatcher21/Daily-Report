<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Download Report</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1c3d5a">
<link rel="stylesheet" href="style.css">
<script src="theme.js"></script>
<link rel="stylesheet" href="print-sheet.css">
<style>
  #pdf-preview-wrap {
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    background: #525659;
    height: 70vh;
    min-height: 380px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  /* The bare ID selector above beats the UA stylesheet's [hidden]{display:none}
     on specificity alone, so toggling .hidden on this element did nothing
     without this. */
  #pdf-preview-wrap[hidden] { display: none; }
  #pdf-frame { width: 100%; height: 100%; border: 0; display: block; }
  #pdf-status { text-align: center; padding: 2.5rem 1rem; color: #dfe3e6; font-size: 0.9rem; }

  /* Phone fallback: the same page images that get embedded into the PDF,
     shown directly as plain <img> tags instead -- unlike a PDF-in-iframe,
     an image just works everywhere, no native viewer support required. */
  #pdf-mobile-gallery { display: flex; flex-direction: column; gap: 1.1rem; margin-bottom: 1rem; }
  .pdf-page-label { font-size: 0.78rem; font-weight: 600; color: var(--text-dim); text-align: center; margin: 0 0 0.35rem; }
  .pdf-page-preview {
    display: block; border: 1px solid var(--border); border-radius: 8px;
    overflow: hidden; background: #fff; box-shadow: var(--shadow); line-height: 0;
  }
  .pdf-page-preview img { display: block; width: 100%; height: auto; }
  #pdf-gallery-hint { text-align: center; margin: -0.5rem 0 0; }

  /* Off-screen sandbox: laid out normally (not display:none) so html2canvas
     can measure real geometry, just parked where nobody sees it. */
  #render-sandbox { position: fixed; top: 0; left: -20000px; z-index: -1; }
</style>
</head>
<body>

<header class="app-header">
  <div>
    <h1>Download Report</h1>
    <div class="app-sub" id="project-name-sub"></div>
  </div>
  <span></span>
</header>
<div class="back-bar">
  <a href="#" id="bb-back-link">&larr; Reports</a>
  <span class="bb-sep">//</span>
  <span class="bb-cur">Download</span>
</div>

<main>
  <div class="step">
    <div class="step-header"><span class="step-num">PREVIEW</span><h2 id="preview-title">Preparing your report&hellip;</h2></div>
    <div class="step-body">
      <div class="warn" id="no-logo-warning" hidden>
        <strong>No company logo set.</strong> This report will print with a blank space in the top-left.
        <a href="settings.html" style="color:inherit;font-weight:700;">Add one in Settings</a>.
      </div>
      <div id="pdf-preview-wrap">
        <div id="pdf-status">Rendering PDF preview&hellip;</div>
        <iframe id="pdf-frame" title="PDF preview" hidden></iframe>
      </div>
      <p class="hint" id="pdf-gallery-hint" hidden>Tap a page to open it full-size.</p>
      <div id="pdf-mobile-gallery" hidden></div>
      <div class="export-bar">
        <button type="button" class="btn-primary" id="btn-download-pdf" disabled>Download PDF</button>
      </div>
    </div>
  </div>
</main>

<div id="render-sandbox"></div>

<script src="lib/html2canvas.min.js"></script>
<script src="lib/jspdf.umd.min.js"></script>
<script src="common.js"></script>
<script src="defaults.js"></script>
<script src="storage.js"></script>
<script src="render-report.js"></script>
<script src="pdf-export.js"></script>
<script type="module" src="firebase-init.js"></script>
<script src="firebase-sync.js"></script>
<script>
// Same signal used elsewhere in the app (Settings' install instructions) to
// tell a phone/tablet apart from a desktop browser -- iPadOS reports as
// "MacIntel" like a real Mac, so touch points are the only way to catch it.
function isMobileDevice() {
  const ua = navigator.userAgent;
  return /Android|iPhone|iPad|iPod/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
}

(async () => {
  const projectId = queryParam('project');
  const reportIdsParam = queryParam('report') || '';
  const reportIds = reportIdsParam.split(',').filter(Boolean);

  const project = projectId ? await getProject(projectId) : null;
  if (!project || reportIds.length === 0 || !projectInScope(project.id, await getCompanyRoom())) {
    $('#pdf-status').textContent = 'Nothing to download.';
    return;
  }
  document.title = `Download — ${project.name}`;
  $('#project-name-sub').textContent = project.name;
  $('#bb-back-link').href = `reports.html?project=${project.id}`;

  const reports = [];
  for (const id of reportIds) {
    let r = await getReport(id);
    if (!r) continue;
    normalizeReport(r);
    // Same lazy-photo story as report-editor.html -- a PDF needs the
    // actual bytes, not just knowing a photo exists, so resolve any
    // unfetched slots before rendering. putReportRaw, not saveReport:
    // generating a PDF isn't an edit, so it shouldn't bump updatedAt or
    // restamp lastEditedBy.
    if ((r.photosFetched || []).some((f) => !f) || r.signatureFetched === false) {
      startProgressBanner();
      progressStep('photos', 'Getting your photos');
      r = await fetchReportMedia(r);
      await putReportRaw(r);
    }
    reports.push(r);
  }
  if (reports.length === 0) {
    $('#pdf-status').textContent = 'Nothing to download.';
    return;
  }

  $('#preview-title').textContent = reports.length === 1
    ? `Report #${reports[0].reportNo} — ${reports[0].date || ''}`
    : `${reports.length} reports selected`;

  const layout = await loadPrintLayout();
  const logoBlob = await getReportLogo();
  $('#no-logo-warning').hidden = !!logoBlob;
  const sandbox = $('#render-sandbox');

  let pdfBlob, captures;
  try {
    ({ blob: pdfBlob, captures } = await buildPdfBlob(sandbox, layout, reports, logoBlob, (done, total) => {
      progressStep('rendering', 'Building your PDF', `${done} of ${total}`);
    }));
    finishProgressBanner('Your PDF is ready!');
  } catch (err) {
    console.error(err);
    progressBannerError(userError("Couldn't generate the PDF: " + err.message, 'BUILD_PDF'));
    return;
  }

  $('#pdf-status').hidden = true;

  // Desktop browsers (Chrome, Edge) render a PDF dropped into an iframe with
  // their own built-in viewer. Phone browsers generally don't wire that up
  // for iframes at all -- the frame just stays blank. Rather than fight
  // that, phones get the same page images that were just rasterized to
  // build the PDF, shown directly as plain <img> tags -- that has no
  // dependency on native PDF support at all, so it just works everywhere.
  if (isMobileDevice()) {
    $('#pdf-preview-wrap').hidden = true;
    $('#pdf-gallery-hint').hidden = false;
    const gallery = $('#pdf-mobile-gallery');
    gallery.hidden = false;
    gallery.innerHTML = captures
      .map((cap, i) => {
        const viewUrl = URL.createObjectURL(cap.viewBlob);
        return `
        <div>
          ${captures.length > 1 ? `<p class="pdf-page-label">Page ${i + 1} of ${captures.length}</p>` : ''}
          <a class="pdf-page-preview" href="${viewUrl}" target="_blank" rel="noopener">
            <img src="${cap.dataUrl}" alt="Report page ${i + 1}" loading="lazy">
          </a>
        </div>`;
      })
      .join('');
  } else {
    const frame = $('#pdf-frame');
    frame.src = URL.createObjectURL(pdfBlob);
    frame.hidden = false;
  }

  const btnPdf = $('#btn-download-pdf');
  btnPdf.disabled = false;
  btnPdf.addEventListener('click', () => triggerDownload(pdfBlob, pdfFilename(reports)));
})();
</script>
</body>
</html>
