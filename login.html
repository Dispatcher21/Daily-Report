<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Daily Work Reports</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1c3d5a">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Daily Reports">
<link rel="stylesheet" href="style.css">
<script src="theme.js"></script>
<style>
  /* A one-card welcome screen, not a data page -- the site-wide main width
     is for pages with actual content to spread out; this just wants a
     normal-sized centered card regardless of how wide the window is. */
  main { max-width: 480px; }
</style>
</head>
<body>

<header class="app-header">
  <div>
    <h1>Daily Work Reports</h1>
    <div class="app-sub">Field inspection reporting</div>
  </div>
  <span></span>
</header>

<main>
  <div class="step">
    <div class="step-header">
      <span class="step-num">WELCOME</span>
      <h2>Get Started</h2>
    </div>
    <div class="step-body">
      <p class="hint" style="margin-top:0;">Your name fills in as Representative on every report you file, so an admin can tell whose work is whose. This is remembered on this device -- you won't see this again unless you change it in Settings.</p>

      <label>Your Name
        <input type="text" id="f-name" autocomplete="name">
      </label>

      <label style="margin-top:0.75rem;">Company Password <span class="hint" style="display:inline;">(optional)</span>
        <input type="password" id="f-password" autocomplete="current-password">
        <span class="hint">Leave blank to use the app on this device only. You can join or create a company later from Settings.</span>
      </label>

      <button type="button" class="btn-primary" id="btn-continue" style="margin-top:0.75rem;">Continue</button>
      <div class="err" id="login-error" hidden></div>
    </div>
  </div>
</main>

<script src="common.js"></script>
<script src="defaults.js"></script>
<script src="storage.js"></script>
<script type="module" src="firebase-init.js"></script>
<script src="firebase-sync.js"></script>
<script>

onEnterSubmit($('.step-body'), $('#btn-continue'));

$('#btn-continue').addEventListener('click', async () => {
  const btn = $('#btn-continue');
  const errorEl = $('#login-error');
  errorEl.hidden = true;

  const name = $('#f-name').value.trim();
  const password = $('#f-password').value;
  if (!name) {
    errorEl.textContent = 'Enter your name.';
    errorEl.hidden = false;
    return;
  }

  btn.disabled = true;
  startProgressBanner();
  progressStep('saving', password ? 'Signing you in' : 'Saving your name');
  try {
    await saveUserName(name);
    if (password) {
      await joinCompanyRoom(password, reportCompanyProgress);
    }
    finishProgressBanner("You're all set!");
    location.href = 'index.html';
  } catch (err) {
    console.error(err);
    const msg = password
      ? "Couldn't join with that company password: " + err.message + ' Your name is saved, though -- clear the password and continue if you want to join later instead.'
      : "Couldn't continue: " + err.message;
    progressBannerError(userError(msg, password ? 'JOIN_COMPANY' : 'CONTINUE_LOCAL'));
    btn.disabled = false;
  }
});

// Already set up on this device -- skip straight past.
(async () => {
  const name = await getUserName();
  if (name) location.href = 'index.html';
})();
</script>
</body>
</html>
