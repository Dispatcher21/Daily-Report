<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" role="img" aria-label="Daily Reports">
  <rect width="192" height="192" rx="28" fill="#1c3d5a"/>

  <!-- Clipboard: reads at any size, so the icon still works as a favicon
       where the wordmark underneath is too small to resolve. -->
  <rect x="46" y="36" width="100" height="102" rx="10" fill="#ffffff"/>
  <rect x="76" y="25" width="40" height="21" rx="7" fill="#bcd2e0"/>

  <g stroke="#1c3d5a" stroke-width="8" stroke-linecap="round">
    <line x1="64" y1="70" x2="128" y2="70"/>
    <line x1="64" y1="92" x2="128" y2="92"/>
    <line x1="64" y1="114" x2="104" y2="114"/>
  </g>

  <text x="96" y="168" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="20" font-weight="700" letter-spacing="1" fill="#bcd2e0" text-anchor="middle">DAILY REPORTS</text>
</svg>
