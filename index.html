<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Daily Work Reports</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1c3d5a">
<link rel="stylesheet" href="style.css">
<script src="theme.js"></script>
<style>
  /* A plain `hidden` attribute doesn't work here: this link also needs
     display:block while visible, and any author-stylesheet rule that sets
     display on an element overrides the UA [hidden]{display:none} rule
     regardless of specificity -- so visibility is a class, not `hidden`. */
  #link-company-management { display: none; text-align: center; text-decoration: none; margin-bottom: 1rem; }
  #link-company-management.show { display: block; }
</style>
</head>
<body>

<header class="app-header">
  <div>
    <h1>Daily Work Reports</h1>
    <div class="app-sub">Field inspection reporting &mdash; fully on-device</div>
  </div>
  <span></span>
</header>

<main>
  <a class="btn-secondary" id="link-company-management" href="company-management.html">&#9881;&#65039; Company Management</a>

  <div class="eyebrow">Your Projects</div>
  <div id="hub-grid" class="hub-grid"></div>

  <!-- ADD PROJECT PANEL (revealed in place, no separate page) -->
  <div id="add-project-panel" class="step" hidden>
    <div class="step-header">
      <span class="step-num">NEW PROJECT</span>
      <h2>Add a Project</h2>
    </div>
    <div class="step-body">
      <div style="display:flex;align-items:center;gap:1rem;margin-bottom:0.75rem;flex-wrap:wrap;">
        <span class="hint" style="margin:0;">Upload an Excel file with this project's info and pay items.</span>
        <button type="button" class="text-btn" id="btn-download-project-template" style="color:var(--brand);text-decoration:underline;padding:0;">&#8681; Download Template</button>
      </div>

      <div class="uz" id="uz-project-data">
        <input type="file" id="f-project-data" accept=".xlsx,.xls">
        <span class="uz-icon">&#128202;</span>
        <span class="uz-lbl">Upload Project Data (Excel)</span>
        <span class="uz-hint">PROJECT INFO + PAY ITEMS sheets</span>
        <span class="uz-fname" id="fn-project-data"></span>
      </div>

      <div id="parsed-preview"></div>

      <div class="export-bar">
        <button type="button" class="btn-primary" id="btn-save-new-project" disabled>Save Project</button>
        <button type="button" class="btn-secondary" id="btn-cancel-new-project">Cancel</button>
      </div>
    </div>
  </div>

</main>

<script src="lib/xlsx.min.js"></script>
<script src="common.js"></script>
<script src="defaults.js"></script>
<script src="storage.js"></script>
<script src="local-folder-sync.js"></script>
<script src="project-file.js"></script>
<script src="setup-share.js"></script>
<script type="module" src="firebase-init.js"></script>
<script src="firebase-sync.js"></script>
<script>
let pendingParsed = null;
let hubCardBgUrls = [];


async function renderProjectCards() {
  // One getAllReports() call, not one per project -- it already reads every
  // report in the store, so calling it per-project would just repeat the same
  // full read N times.
  const room = await getCompanyRoom();
  const [allProjects, reports] = await Promise.all([getAllProjects(), getAllReports()]);
  // A custom setup's password scopes which projects are even visible, not
  // just what can be edited -- see projectInScope in firebase-sync.js.
  const projects = allProjects.filter((p) => projectInScope(p.id, room));
  const countByProject = new Map();
  for (const r of reports) {
    countByProject.set(r.projectId, (countByProject.get(r.projectId) || 0) + 1);
  }

  // Re-rendered on every project add/save, so previous cards' background
  // object URLs need revoking or they'd leak one per render.
  hubCardBgUrls.forEach((url) => URL.revokeObjectURL(url));
  hubCardBgUrls = [];

  const grid = $('#hub-grid');
  const cards = projects
    .map((p) => {
      const n = countByProject.get(p.id) || 0;
      const countLabel = n === 1 ? '1 report' : `${n} reports`;
      let bgHtml = '';
      if (p.backgroundImage) {
        const url = URL.createObjectURL(p.backgroundImage);
        hubCardBgUrls.push(url);
        bgHtml = `<img class="hc-bg-img" src="${url}" alt=""><div class="hc-bg-fade"></div>`;
      }
      return `
      <a class="hub-card${p.backgroundImage ? ' has-bg' : ''}" href="project.html?id=${p.id}">
        ${bgHtml}
        <span class="hc-icon">&#128193;</span>
        <div class="hc-title">${escapeHtml(p.name)}</div>
        <div class="hc-desc">${escapeHtml(p.meta.projectName || '')}</div>
        <div class="hc-count">${countLabel}</div>
      </a>`;
    })
    .join('');
  const canCreate = await companyCan('createProjects');
  grid.innerHTML = cards + (canCreate ? `<div class="hub-card add-card" id="btn-add-project">+ Add Project</div>` : '');
  if (projects.length === 0) {
    grid.insertAdjacentHTML(
      'afterbegin',
      canCreate
        ? '<div class="empty-state" style="grid-column:1/-1;">No projects yet. Tap "+ Add Project" to upload your first project\'s data file.</div>'
        : '<div class="empty-state" style="grid-column:1/-1;">No projects yet -- ask an admin to add one.</div>'
    );
  }
  if (canCreate) $('#btn-add-project').addEventListener('click', showAddProjectPanel);
}

function showAddProjectPanel() {
  $('#add-project-panel').hidden = false;
  $('#add-project-panel').scrollIntoView({ behavior: 'smooth' });
}

function resetAddProjectPanel() {
  pendingParsed = null;
  $('#add-project-panel').hidden = true;
  $('#uz-project-data').classList.remove('has');
  $('#fn-project-data').textContent = '';
  $('#parsed-preview').innerHTML = '';
  $('#f-project-data').value = '';
  $('#btn-save-new-project').disabled = true;
}

$('#btn-download-project-template').addEventListener('click', downloadProjectDataTemplate);

$('#f-project-data').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  try {
    pendingParsed = await parseProjectDataFile(file);
    $('#uz-project-data').classList.add('has');
    $('#fn-project-data').textContent = file.name;

    const m = pendingParsed.meta;
    $('#parsed-preview').innerHTML = `
      <div class="uz has" style="text-align:left;cursor:default;">
        <div style="font-weight:700;font-size:0.85rem;margin-bottom:0.4rem;">Parsed: ${escapeHtml(m.name || m.projectNo || 'project')}</div>
        <div class="hint" style="margin:0;">Project No: ${escapeHtml(m.projectNo || '(none)')} &middot; Project Name: ${escapeHtml(m.projectName || '(none)')}</div>
        <div class="hint" style="margin:0;">Pay items found: ${pendingParsed.payItemCatalog.length} &middot; Contractors: ${pendingParsed.contractors.length} &middot; Equipment labels: ${pendingParsed.equipmentLabels.length}</div>
      </div>`;
    $('#btn-save-new-project').disabled = false;
  } catch (err) {
    console.error(err);
    alert('Could not read that file: ' + err.message);
  }
});

$('#btn-cancel-new-project').addEventListener('click', resetAddProjectPanel);

$('#btn-save-new-project').addEventListener('click', async () => {
  if (!pendingParsed) return;
  const btn = $('#btn-save-new-project');
  btn.disabled = true;
  btn.textContent = 'Saving...';
  try {
    const project = makeProjectFromParsedFile(pendingParsed);
    await saveProject(project);
    resetAddProjectPanel();
    await renderProjectCards();
  } catch (err) {
    console.error(err);
    alert('Could not save the project: ' + err.message);
  } finally {
    btn.textContent = 'Save Project';
    btn.disabled = false;
  }
});

// ---------- Incoming shared setup ----------
//
// Arrives as #setup=... from a shared setup card or a scanned QR. Always shown
// and confirmed first: silently gaining projects from a link someone forwarded
// would be baffling, and the sender may not have meant to include everything.
async function handleIncomingSetup() {
  const hash = location.hash || '';
  const match = hash.match(new RegExp('[#&]' + SETUP_FRAGMENT_KEY + '=([^&]+)'));
  if (!match) return false;

  // Clear it immediately so a refresh doesn't re-prompt, and so the payload
  // doesn't linger in the address bar.
  history.replaceState(null, '', location.pathname + location.search);

  let payload;
  try {
    payload = await decodeSetupPayload(match[1]);
  } catch (err) {
    console.error(err);
    alert("That setup link couldn't be read. It may have been truncated in transit.");
    return false;
  }

  const summary = describeSetupPayload(payload);
  if (!confirm(`Add this shared setup?\n\n${summary}\n\nYour own reports and photos are not affected.`)) {
    return false;
  }

  try {
    const res = await applySetupPayload(payload);
    if (res.logoAdded) {
      // A shared setup can be the very first time this device gets a logo --
      // refresh now rather than waiting for the next page load to show it.
      applyHeaderLogo();
    }
    const bits = [];
    if (res.added) bits.push(`${res.added} project(s) added`);
    if (res.updated) bits.push(`${res.updated} updated`);
    if (res.logoAdded) bits.push('logo set');
    alert(bits.length ? 'Setup applied: ' + bits.join(', ') + '.' : 'Nothing to add.');
    return true;
  } catch (err) {
    console.error(err);
    alert('Could not apply that setup: ' + err.message);
    return false;
  }
}

// ---------- Init ----------

(async () => {
  if (!(await getUserName())) {
    location.href = 'login.html';
    return;
  }
  const room = await getCompanyRoom();
  $('#link-company-management').classList.toggle('show', !!(room && room.isAdmin));

  await handleIncomingSetup();
  await adoptOrphanReportsIfAny();
  await renderProjectCards();
})();
</script>
</body>
</html>
