<style>
  main { max-width: 1440px; }
  #qty-step [hidden] { display: none !important; }
  #qty-step .step-header h2 { flex: 0 1 auto; }
  .qs-toolbar .view-toggle-btn { white-space: nowrap; flex: none; width: auto; padding: 0 0.9rem; font-size: 0.88rem; font-weight: 700; color: var(--text); }
  .qs-toolbar .view-toggle-btn.active { color: var(--on-brand); }
  .qs-ledger a { color: var(--link); }
  .qs-head-actions { margin-left: auto; display: flex; gap: 0.5rem; flex-wrap: wrap; }
  .qs-head-btn {
    border-radius: var(--radius-sm); padding: 0.35rem 0.8rem; font-size: 0.88rem; font-weight: 700;
    border: 1.5px solid rgba(255, 255, 255, 0.35); background: rgba(255, 255, 255, 0.12); color: var(--on-brand);
    text-decoration: none; cursor: pointer; font-family: inherit; min-height: 0;
  }
  .qs-head-btn.solid { background: var(--on-brand); color: var(--brand); border-color: var(--on-brand); }
  #qty-body { display: grid; gap: 0.9rem; grid-template-columns: minmax(0, 1fr); }
  #qty-body > *, .qs-table, .qs-ledger { min-width: 0; }
  .qs-range { display: flex; flex-wrap: wrap; gap: 0.4rem; }
  .qs-chip {
    border: 1.5px solid var(--border); background: var(--surface); color: var(--text); border-radius: 999px;
    padding: 0.35rem 0.85rem; font-size: 0.88rem; font-weight: 600; cursor: pointer; min-height: 0; font-family: inherit;
  }
  .qs-chip[aria-pressed="true"] { background: var(--brand); border-color: var(--brand); color: var(--on-brand); }
  .qs-custom { display: flex; flex-wrap: wrap; gap: 0.75rem; }
  .qs-custom label { flex: 0 1 12rem; margin: 0; }
  .qs-toolbar { display: flex; flex-wrap: wrap; gap: 0.6rem; align-items: center; }
  .qs-summary { margin: 0; flex: 1 1 16rem; font-size: 0.9rem; color: var(--text-dim); font-variant-numeric: tabular-nums; }
  .qs-summary b { color: var(--text); }
  #qty-search { flex: 0 1 18rem; min-width: 0; margin: 0; }

  /* Item table: a grid that turns into stacked cards on a phone. */
  .qs-table { border: 1px solid var(--border); border-radius: var(--radius-sm); overflow: hidden; }
  .qs-row { display: grid; grid-template-columns: minmax(11rem, 1.6fr) minmax(0, 1.1fr) minmax(0, 2fr) 10rem; gap: 0.75rem; align-items: center; padding: 0.7rem 0.9rem; border-top: 1px solid var(--border); }
  .qs-row.qs-head { border-top: 0; background: var(--surface-2); font-size: 0.68rem; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-dim); padding-block: 0.5rem; }
  button.qs-row { width: 100%; text-align: left; background: var(--surface); color: inherit; font: inherit; border-left: 0; border-right: 0; border-bottom: 0; border-radius: 0; cursor: pointer; min-height: 0; }
  button.qs-row:hover { background: var(--surface-2); }
  button.qs-row[aria-expanded="true"] { background: var(--brand-dim); }
  .qs-row:first-child { border-top: 0; }
  .qs-item { display: grid; min-width: 0; }
  .qs-num { font-weight: 800; }
  .qs-desc { font-size: 0.85rem; color: var(--text-dim); }
  .qs-chev { display: inline-block; font-size: 0.75rem; color: var(--text-dim); margin-right: 0.35rem; transition: transform 0.15s; }
  button.qs-row[aria-expanded="true"] .qs-chev { transform: rotate(90deg); }
  .qs-big { font-weight: 800; font-variant-numeric: tabular-nums; }
  .qs-small { font-size: 0.8rem; color: var(--text-dim); }
  .qs-label { display: none; }
  .qs-ledger { background: var(--surface-2); border-top: 1px solid var(--border); padding: 0.6rem 0.9rem 0.8rem 2.1rem; }
  .qs-ledger table { width: 100%; border-collapse: collapse; font-size: 0.88rem; font-variant-numeric: tabular-nums; }
  .qs-ledger th { text-align: left; font-size: 0.68rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-dim); padding: 0.25rem 0.6rem 0.25rem 0; }
  .qs-ledger td { padding: 0.35rem 0.6rem 0.35rem 0; border-top: 1px solid var(--border); vertical-align: top; }
  .qs-ledger .r { text-align: right; white-space: nowrap; }
  .qs-ledger tr.qs-billed td { background: var(--billed-bg); }
  .qs-ledger .qs-ahead { color: var(--danger); font-weight: 800; }
  .qs-where { display: block; font-size: 0.78rem; color: var(--text-dim); }
  .qs-empty { padding: 1.2rem; text-align: center; color: var(--text-dim); margin: 0; }
  .qs-byday { border-collapse: collapse; width: 100%; font-size: 0.88rem; font-variant-numeric: tabular-nums; }
  .qs-byday th, .qs-byday td { padding: 0.5rem 0.7rem; border-top: 1px solid var(--border); text-align: right; white-space: nowrap; }
  .qs-byday th:first-child, .qs-byday td:first-child { text-align: left; position: sticky; left: 0; background: var(--surface); }
  .qs-byday thead th, .qs-byday thead th:first-child { background: var(--surface-2); border-top: 0; font-size: 0.72rem; color: var(--text-dim); vertical-align: bottom; }
  .qs-byday tr.qs-off td { color: var(--text-dim); font-style: italic; }
  .qs-byday tfoot td, .qs-byday tfoot td:first-child { font-weight: 800; background: var(--surface-2); }
  .qs-scroll { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius-sm); }
  .qs-export-card { max-width: 460px; padding: 0; overflow: hidden; }
  .qs-export-card .step-body { display: grid; gap: 0.7rem; }
  .qs-opt { display: flex; gap: 0.6rem; align-items: flex-start; padding: 0.55rem 0.7rem; border: 1px solid var(--border); border-radius: var(--radius-sm); cursor: pointer; margin: 0; font-weight: 400; }
  .qs-opt input { width: 18px; height: 18px; margin-top: 0.15rem; flex: none; min-height: 0; }
  .qs-opt b { display: block; }
  .qs-opt small { color: var(--text-dim); }
  .qs-dialog-actions { display: flex; justify-content: flex-end; gap: 0.6rem; flex-wrap: wrap; }
  .qs-dialog-actions .btn-primary { width: auto; }
  @media (max-width: 720px) {
    .qs-row.qs-head { display: none; }
    .qs-row { grid-template-columns: minmax(0, 1fr) auto; gap: 0.4rem 0.9rem; }
    .qs-row > .qs-c-chk { order: 1; align-self: start; }
    .qs-row > .qs-c-range { order: 2; grid-column: 1 / -1; }
    .qs-row > .qs-c-prog { order: 3; grid-column: 1 / -1; }
    .qs-label { display: inline; font-size: 0.66rem; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-dim); }
    .qs-ledger { padding-left: 0.9rem; }
    #qty-search { flex: 1 1 100%; }
    #qty-step .step-header .step-num, #qty-step .step-header .info-tip { display: none; }
  }
  /* A phone: the status chip goes under the item instead of squeezing it. */
  @media (max-width: 480px) {
    .qs-row { grid-template-columns: minmax(0, 1fr); }
    .qs-row > .qs-c-chk { order: 1; justify-self: start; }
  }
  @media (prefers-reduced-motion: reduce) { .qs-chev { transition: none; } }
</style>

      <label class="qs-opt"><input type="checkbox" id="opt-include-detail" checked><span><b>Detail Log</b><small>Every entry with stations, side, date and inspector.</small></span></label>
      <div class="qs-dialog-actions">

<script src="quantity-calc.js"></script>
<script src="quantities-ui.js"></script>

<script>
const projectId = queryParam('project');
// Arriving from Reports' "Quantity Sheet Selected" names specific report
// ids; that batch becomes a Custom range over its own dates. ?from=&to=
// (from a Pay App's "What was logged in this period") does the same.
const preselectedIds = new Set((queryParam('report') || '').split(',').filter(Boolean));
let project = null;
let allReports = [];
let latestPayApp = null;
const state = { range: 'all', from: '', to: '', view: 'items', search: '', showAll: false, open: new Set(), fullHistory: new Set() };

async function init() {
  project = projectId ? await getProject(projectId) : null;
  if (!project || !projectInScope(project, await getCompanyRoom())) {
    location.href = 'index.html';
    return;
  }
  document.title = `Quantities · ${project.name}`;
  $('#project-name-sub').textContent = project.name;
  renderBreadcrumb('#bb-trail', [
    { label: 'Home', href: 'index.html' },
    { label: project.name, href: `project.html?id=${project.id}` },
    { label: 'Quantities' },
  ]);
  $('#btn-log').href = `quick-quantity.html?project=${project.id}`;
  allReports = (await getReportsForProject(project.id)).sort((a, b) => (a.date || '').localeCompare(b.date || ''));
  latestPayApp = qtyLatestEstimate(project);

  const dated = allReports.filter((r) => r.date);
  const picked = dated.filter((r) => preselectedIds.has(r.id));
  if (picked.length) {
    setCustom(picked[0].date, picked[picked.length - 1].date);
  } else if (queryParam('from') || queryParam('to')) {
    setCustom(queryParam('from') || '', queryParam('to') || '');
  } else if (latestPayApp && reportsInRange(...rangeBounds('sincepa')).length) {
    state.range = 'sincepa';
  }
  render();
}

function setCustom(from, to) {
  state.range = 'custom';
  state.from = from;
  state.to = to;
  $('#f-date-from').value = from;
  $('#f-date-to').value = to;
}

// ---------- Range ----------

const addDaysIso = (iso, n) => { const d = new Date(iso + 'T12:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
const weekdayOf = (iso) => new Date(iso + 'T12:00:00Z').getUTCDay();
const shortDate = (iso) => new Date(iso + 'T12:00:00Z').toLocaleDateString(undefined, { month: 'short', day: 'numeric', timeZone: 'UTC' });
const dayLabel = (iso) => new Date(iso + 'T12:00:00Z').toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric', timeZone: 'UTC' });

// [from, to, label] for a range; null means open-ended. 'all' is every
// report, undated ones included.
function rangeBounds(range) {
  const today = todayIso();
  const monday = addDaysIso(today, -((weekdayOf(today) + 6) % 7));
  switch (range) {
    case 'week': return [monday, addDaysIso(monday, 6), 'this week'];
    case 'lastweek': return [addDaysIso(monday, -7), addDaysIso(monday, -1), 'last week'];
    case 'month': return [today.slice(0, 8) + '01', today, 'this month'];
    case 'sincepa': return latestPayApp ? [addDaysIso(latestPayApp.date, 1), today, `since Pay App ${latestPayApp.estimateNo}`] : [null, null, 'all reports'];
    case 'custom': return [state.from || null, state.to || null, 'in this range'];
    default: return [null, null, 'all reports'];
  }
}

function reportsInRange(from, to) {
  if (from == null && to == null) return allReports;
  return allReports.filter((r) => r.date && (!from || r.date >= from) && (!to || r.date <= to));
}

// ---------- Render ----------

function render() {
  const [from, to, label] = rangeBounds(state.range);
  const reports = reportsInRange(from, to);
  const ranged = from != null || to != null;
  const loggedRange = qtyLoggedByItem(reports);
  const loggedAll = qtyLoggedByItem(allReports);
  const billed = qtyBilledByItem(latestPayApp);
  const items = qtyItems(project, [...loggedAll.keys(), ...billed.keys()]);

  $('#qp-tabs').innerHTML = qtySectionTabsHtml(project, qtyProjectSummary(project, allReports), 'quantities');
  $('#qty-cbar').innerHTML = qtyContractBarHtml(qtyContractSums(items, loggedAll, billed),
    latestPayApp ? `logged through today, billed through Pay App ${latestPayApp.estimateNo}` : 'no Pay Apps recorded yet');
  $$('#range-chips .qs-chip').forEach((b) => {
    b.setAttribute('aria-pressed', String(b.dataset.range === state.range));
    if (b.dataset.range === 'sincepa') b.hidden = !latestPayApp;
  });
  $('#custom-range').hidden = state.range !== 'custom';

  const rangeCost = items.reduce((s, it) => s + (qtyCost(it, loggedRange.get(it.itemNumber) || 0) || 0), 0);
  const dates = reports.filter((r) => r.date).map((r) => r.date);
  const span = !ranged
    ? (dates.length ? `${shortDate(dates[0])} to ${shortDate(dates[dates.length - 1])}` : 'every report')
    : `${from ? shortDate(from) : 'start'} to ${to ? shortDate(to > todayIso() ? todayIso() : to) : 'today'}`;
  $('#range-summary').innerHTML = `<b>${rangeCost ? qtyMoney(rangeCost) + ' logged' : 'Logged ' + escapeHtml(label)}</b> &middot; ${escapeHtml(span)} &middot; ${reports.length} report${reports.length === 1 ? '' : 's'}`;

  $('#qty-search').hidden = state.view !== 'items';
  $$('#view-picker .view-toggle-btn').forEach((b) => b.classList.toggle('active', b.dataset.view === state.view));
  $('#view-items').hidden = state.view !== 'items';
  $('#view-byDay').hidden = state.view !== 'byDay';
  if (state.view === 'items') renderItems(items, loggedRange, loggedAll, billed, label, from, to);
  else renderByDay(reports, items, loggedRange);
}

function renderItems(items, loggedRange, loggedAll, billed, label, from, to) {
  const q = state.search.trim().toLowerCase();
  const matches = items.filter((it) => !q || it.itemNumber.toLowerCase().includes(q) || it.description.toLowerCase().includes(q));
  const showRow = (it) => {
    const R = loggedRange.get(it.itemNumber) || 0, L = loggedAll.get(it.itemNumber) || 0, B = billed.get(it.itemNumber) || 0;
    return state.showAll || R !== 0 || (state.range === 'all' && (L !== 0 || B !== 0));
  };
  const rows = matches.filter(showRow);
  const hidden = matches.length - rows.length;
  const html = rows.map((it) => {
    const R = loggedRange.get(it.itemNumber) || 0, L = loggedAll.get(it.itemNumber) || 0, B = billed.get(it.itemNumber) || 0;
    const entries = countEntries(it.itemNumber, from, to);
    const open = state.open.has(it.itemNumber);
    return `<button type="button" class="qs-row" data-item="${escapeHtml(it.itemNumber)}" aria-expanded="${open}">
        <span class="qs-item"><span class="qs-num"><span class="qs-chev" aria-hidden="true">&#9656;</span>${escapeHtml(it.itemNumber)}</span><span class="qs-desc">${escapeHtml(it.description)}</span></span>
        <span class="qs-c-range"><span class="qs-label">Logged ${escapeHtml(label)}: </span>${R ? `<span class="qs-big">${escapeHtml(qtyAmountText(it, R))}</span> <span class="qs-small">${entries} entr${entries === 1 ? 'y' : 'ies'}</span>` : '<span class="qs-small">None</span>'}</span>
        <span class="qs-c-prog">${qtyProgressHtml(it, L, B)}</span>
        <span class="qs-c-chk">${qtyCheckChipHtml(it, L, B)}</span>
      </button>${open ? ledgerHtml(it, from, to) : ''}`;
  }).join('');
  $('#view-items').innerHTML = `
    ${rows.length ? `<div class="qs-table">
      <div class="qs-row qs-head" aria-hidden="true"><span>Pay item</span><span>Logged ${escapeHtml(label)}</span><span>Progress to date</span><span>Check</span></div>
      ${html}</div>` : `<p class="qs-empty">${items.length ? (q ? 'No pay items match that search.' : 'Nothing was logged in this range.') : 'This project has no pay items yet.'}</p>`}
    ${hidden && !state.showAll ? `<button type="button" class="text-btn" id="show-all-items">Show the ${hidden} item${hidden === 1 ? '' : 's'} with nothing logged ${escapeHtml(label)}</button>` : ''}`;
}

function countEntries(itemNumber, from, to) {
  let n = 0;
  reportsInRange(from, to).forEach((r) => (r.payItems || []).forEach((p) => { if (qtyKey(p.itemNumber) === itemNumber && Number(p.qty)) n++; }));
  return n;
}

// One item's history: report entries and Pay App billings in date order,
// with running logged and billed totals, so it's clear where they split.
function ledgerHtml(it, from, to) {
  const events = [];
  allReports.forEach((r) => (r.payItems || []).forEach((p) => {
    const q = Number(p.qty);
    if (qtyKey(p.itemNumber) !== it.itemNumber || !isFinite(q) || !q) return;
    const where = [p.startStation && p.endStation ? `Sta. ${p.startStation} to ${p.endStation}` : p.startStation ? `Sta. ${p.startStation}` : '', p.location, p.side].filter(Boolean).join(' · ');
    events.push({ date: r.date || '', kind: 'logged', q, label: `Report #${r.reportNo}`, href: `report-viewer.html?project=${project.id}&report=${r.id}`, where });
  }));
  let prev = 0;
  sortedEstimates(project.billingEstimates).forEach((e) => {
    const total = qtyBilledByItem(e).get(it.itemNumber) || 0;
    if (!qtyEqual(total, prev)) events.push({ date: e.date || '', kind: 'billed', q: total - prev, label: `Pay App ${e.estimateNo}`, href: `pay-apps.html?project=${project.id}&estimate=${e.id}` });
    prev = total;
  });
  // Undated reports last; a Pay App after the reports of its own date.
  events.sort((a, b) => (a.date === b.date ? (a.kind === 'logged' ? -1 : 1) : !a.date ? 1 : !b.date ? -1 : a.date < b.date ? -1 : 1));
  let L = 0, B = 0;
  const rows = events.map((e) => {
    if (e.kind === 'logged') L += e.q; else B += e.q;
    const inRange = (from == null && to == null) || (e.date && (!from || e.date >= from) && (!to || e.date <= to));
    return { ...e, L, B, inRange };
  });
  const shown = state.fullHistory.has(it.itemNumber) ? rows : rows.filter((r) => r.inRange);
  const more = rows.length - shown.length;
  const amt = (v) => escapeHtml(qtyAmountText(it, v));
  return `<div class="qs-ledger">
    ${shown.length ? `<div class="table-scroll"><table>
      <thead><tr><th>Date</th><th>Entry</th><th class="r">Amount</th><th class="r">Logged total</th><th class="r">Billed total</th></tr></thead>
      <tbody>${shown.map((e) => `<tr${e.kind === 'billed' ? ' class="qs-billed"' : ''}>
        <td>${e.date ? dayLabel(e.date) : 'No date'}</td>
        <td><a href="${e.href}">${escapeHtml(e.label)}</a>${e.where ? `<span class="qs-where">${escapeHtml(e.where)}</span>` : ''}</td>
        <td class="r">${e.kind === 'billed' ? 'billed ' : ''}${e.q > 0 && e.kind === 'billed' ? '+' : ''}${amt(e.q)}</td>
        <td class="r">${amt(e.L)}</td>
        <td class="r${e.B > e.L + 1e-9 ? ' qs-ahead' : ''}">${amt(e.B)}</td></tr>`).join('')}</tbody>
    </table></div>` : `<p class="hint" style="margin:0;">Nothing logged or billed for ${escapeHtml(it.itemNumber)} in this range.</p>`}
    ${more ? `<button type="button" class="text-btn" data-full-history="${escapeHtml(it.itemNumber)}">Show the full history (${more} more)</button>` : ''}
  </div>`;
}

// A row per reporting day, a column per item logged in the range.
function renderByDay(reports, items, loggedRange) {
  const cols = items.filter((it) => (loggedRange.get(it.itemNumber) || 0) !== 0);
  if (!cols.length) {
    $('#view-byDay').innerHTML = '<p class="qs-empty">Nothing was logged in this range.</p>';
    return;
  }
  const byDate = new Map();
  reports.forEach((r) => {
    const key = r.date || NO_DATE_KEY;
    if (!byDate.has(key)) byDate.set(key, []);
    byDate.get(key).push(r);
  });
  const dates = Array.from(byDate.keys()).sort(compareDateKeys);
  const cell = (it, v) => (v ? (it.isLump ? qtyMoney(v) : qtyNum(v)) : '');
  const body = dates.map((d) => {
    const day = qtyLoggedByItem(byDate.get(d));
    const nos = byDate.get(d).map((r) => `#${r.reportNo}`).join(', ');
    const label = `${d === NO_DATE_KEY ? 'No date' : dayLabel(d)} <span class="qs-small">${escapeHtml(nos)}</span>`;
    if (!cols.some((it) => day.get(it.itemNumber))) return `<tr class="qs-off"><td>${label}</td><td colspan="${cols.length}" style="text-align:left">No quantities logged</td></tr>`;
    return `<tr><td>${label}</td>${cols.map((it) => `<td>${cell(it, day.get(it.itemNumber))}</td>`).join('')}</tr>`;
  }).join('');
  $('#view-byDay').innerHTML = `<div class="qs-scroll"><table class="qs-byday">
    <thead><tr><th>Day</th>${cols.map((it) => `<th title="${escapeHtml(it.description)}">${escapeHtml(it.itemNumber)}<br><span style="font-weight:600">${it.isLump ? 'LS $' : escapeHtml(it.unit)}</span></th>`).join('')}</tr></thead>
    <tbody>${body}</tbody>
    <tfoot><tr><td>Total logged</td>${cols.map((it) => `<td>${cell(it, loggedRange.get(it.itemNumber))}</td>`).join('')}</tr></tfoot>
  </table></div>`;
}

// ---------- Events ----------

$('#range-chips').addEventListener('click', (e) => {
  const btn = e.target.closest('[data-range]');
  if (!btn) return;
  state.range = btn.dataset.range;
  if (state.range === 'custom' && !state.from && !state.to) {
    const dated = allReports.filter((r) => r.date);
    if (dated.length) setCustom(dated[0].date, dated[dated.length - 1].date);
  }
  state.open.clear();
  state.fullHistory.clear();
  state.showAll = false;
  render();
});
['#f-date-from', '#f-date-to'].forEach((sel) => $(sel).addEventListener('change', () => {
  state.from = $('#f-date-from').value;
  state.to = $('#f-date-to').value;
  render();
}));
$('#view-picker').addEventListener('click', (e) => {
  const btn = e.target.closest('[data-view]');
  if (!btn) return;
  state.view = btn.dataset.view;
  render();
});
$('#qty-search').addEventListener('input', (e) => {
  state.search = e.target.value;
  render();
});
$('#view-items').addEventListener('click', (e) => {
  if (e.target.closest('a')) return;
  const full = e.target.closest('[data-full-history]');
  if (full) { state.fullHistory.add(full.dataset.fullHistory); render(); return; }
  if (e.target.closest('#show-all-items')) { state.showAll = true; render(); return; }
  const row = e.target.closest('button.qs-row');
  if (!row) return;
  const n = row.dataset.item;
  if (state.open.has(n)) state.open.delete(n); else state.open.add(n);
  render();
});

// ---------- Excel ----------
// buildQuantitySheetWorkbook lives in quantity-sheet-export.js, shared with
// local-sync.js's folder sync so the two never build different workbooks.

const qtyOptions = { showZero: false, includeByDay: true, includeDetail: true };
$('#opt-include-byday').addEventListener('change', (e) => { qtyOptions.includeByDay = e.target.checked; });
$('#opt-include-detail').addEventListener('change', (e) => { qtyOptions.includeDetail = e.target.checked; });

function closeExport() { $('#export-dialog').hidden = true; }
$('#btn-export').addEventListener('click', () => {
  const [from, to, label] = rangeBounds(state.range);
  const n = reportsInRange(from, to).length;
  $('#export-range').textContent = `${n} report${n === 1 ? '' : 's'} (${label}). Choose which sheets to include.`;
  $('#btn-generate').disabled = n === 0;
  $('#export-dialog').hidden = false;
  $('#btn-generate').focus();
});
$('#btn-export-cancel').addEventListener('click', closeExport);
$('#export-dialog').addEventListener('click', (e) => { if (e.target.id === 'export-dialog') closeExport(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !$('#export-dialog').hidden) closeExport(); });

$('#btn-generate').addEventListener('click', async () => {
  const selected = reportsInRange(...rangeBounds(state.range).slice(0, 2));
  if (selected.length === 0) return;
  const btn = $('#btn-generate');
  btn.disabled = true;
  btn.textContent = 'Building...';
  try {
    const room = await getCompanyRoom();
    const result = await buildQuantitySheetWorkbook(selected, project, room, qtyOptions);
    if (!result) {
      alert('None of these reports have any pay items listed, so there is nothing to put in the spreadsheet.');
      return;
    }
    const { wb, dates } = result;
    const realDates = dates.filter((d) => d !== NO_DATE_KEY);
    const projectNo = project.meta.projectNo || 'PR';
    const stamp = realDates.length === 0 ? 'undated'
      : realDates.length === 1 ? realDates[0]
        : `${realDates[0]}_to_${realDates[realDates.length - 1]}`;
    const out = await wb.xlsx.writeBuffer();
    triggerDownload(new Blob([out], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }), `PR${projectNo}_QuantitySheet_${stamp}.xlsx`);
    closeExport();
  } catch (err) {
    console.error(err);
    alert(userError("Couldn't build the quantity sheet: " + err.message, 'QUANTITY_SHEET'));
  } finally {
    btn.textContent = 'Download .xlsx';
    btn.disabled = false;
  }
});

init().then(wireAutoPull);
</script>
